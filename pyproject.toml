[build-system]
requires = ["maturin>=1.9.3,<2.0"]
build-backend = "maturin"

[project]
name = "ruff"
version = "0.17.3"
description = "An extremely fast Python linter and code formatter, written in Rust."
authors = [{ name = "Astral Software Inc.", email = "hey@astral.sh" }]
readme = "README.md"
requires-python = ">=3.7"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "automation",
    "flake8",
    "pycodestyle",
    "pyflakes",
    "pylint",
    "clippy",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Repository = "https://github.com/astral-sh/ruff"
Documentation = "https://docs.astral.sh/ruff/"
Changelog = "https://github.com/astral-sh/ruff/blob/main/CHANGELOG.md"

[tool.maturin]
bindings = "bin"
manifest-path = "crates/ruff/Cargo.toml"
module-name = "ruff"
python-source = "python"
strip = true
exclude = [
    "crates/ruff_linter/resources/test/fixtures/**/*",
    "crates/ruff_linter/src/rules/*/snapshots/**/*"
]

[dependency-groups]
dev = [
    "astral-dev-toolchain-cargo-codspeed>=5.0.1",
    "astral-dev-toolchain-cargo-deny>=0.20.2",
    "astral-dev-toolchain-cargo-fuzz>=0.13.2",
    "astral-dev-toolchain-cargo-insta>=1.48.0",
    "astral-dev-toolchain-cargo-nextest>=0.9.143",
    "astral-dev-toolchain-cargo-shear>=1.13.4",
    "astral-dev-toolchain-hyperfine>=2.0.0",
    "prek==0.5.3",
]
release = [
    "rooster==0.1.1",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-github-admonitions-plugin>=0.1.1",
    "mkdocs-llmstxt>=0.2.0",
    "mkdocs-material>=9.7.7",
    "mkdocs-redirects>=1.2.3",
    "pyyaml>=6.0.3",
]
ty-ecosystem = [
    "ecosystem-analyzer",
]
typeshed-docstrings = [
    "docstring-adder",
]
typeshed-formatting = [
    "black>=26.10.0",
]

[tool.uv]
no-build = true
require-build-hashes = true
# By default, uv records all `exclude-newer-package` exemptions in the lockfile for
# every script in the repo, even when the corresponding package is not in the
# lockfile for that script. This preview feature omits those entries, so changes
# to unrelated exemptions don't cause script lockfiles to be updated when refreshed.
# https://docs.astral.sh/uv/concepts/preview/#missing-exclude-newer-package-lock
preview-features = ["build-dependency-hashes", "missing-exclude-newer-package-lock"]
# The `missing-exclude-newer-package-lock` preview feature requires uv 0.12.10 or later.
# Before uv 0.12.10, adding an unrelated `exclude-newer-package` exemption could
# also cause uv to update a script's lockfile the next time the script was run,
# leading to unexpected lockfile changes in PRs.
required-version = ">=0.13.0"
# CI installs the local ecosystem runner and tools pinned to Git revisions.
no-binary-package = [
    "docstring-adder",
    "ecosystem-analyzer",
    "mypy-primer",
    "ruff-ecosystem",
    "typeshed-client",
]
# Pin and verify build dependencies for the project and source-build exceptions.
build-constraint-dependencies = [
    { requirement = "flit-core==4.0.2", hashes = [
        "sha256:8d80717e28d982b41594ed5b14d4e89fbc5bad55473fde27994a3101db18a94e",
