[package]
name = "ruff_notebook"
version = "0.0.21"
description = "This is an internal component crate of Ruff"
authors = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
homepage = { workspace = true }
documentation = { workspace = true }
repository = { workspace = true }
license = { workspace = true }

[dependencies]
ruff_diagnostics = { workspace = true }
ruff_source_file = { workspace = true, features = ["serde"] }
ruff_text_size = { workspace = true }

anyhow = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
# `raw_value` writes cell outputs back exactly as they were read. `float_roundtrip` preserves the
# precision of floats in the notebook and cell metadata, which are deserialized as `Value`s.
serde_json = { workspace = true, features = ["float_roundtrip", "raw_value"] }
thiserror = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
test-case = { workspace = true }

[lints]
workspace = true
