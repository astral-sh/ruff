# This schema defines Python AST node kinds, typed field accessors, and row constructors.
#
# Each [Group.nodes.Name] entry declares a node. Types in a group share a view such
# as Expr or Stmt. The ungrouped section declares nodes such as Arguments and Keyword.
#
# A field type names another node or a scalar value. A trailing ? makes the field
# optional. A trailing * makes it a list. The arena stores child handles and list
# intervals. Literal text and numbers live in the arena's corresponding value tables.
#
# Fields appear in declaration order unless source_order specifies a different order
# for traversal. Set is_annotation on an expression field to call the visitor's
# annotation hook. A node's variant defaults to its name with the group prefix removed.
# Groups can add a suffix to generated kind checks, as in is_if_stmt.

[Mod]
doc = "See also [mod](https://docs.python.org/3/library/ast.html#ast.mod)"

[Mod.nodes.ModModule]
doc = "See also [Module](https://docs.python.org/3/library/ast.html#ast.Module)"
fields = [{ name = "body", type = "Stmt*" }]

[Mod.nodes.ModExpression]
doc = "See also [Module](https://docs.python.org/3/library/ast.html#ast.Module)"
fields = [{ name = "body", type = "Expr" }]

