name: Prepare a fuzz corpus
description: Reuse a fixed-seed Python corpus and publish it from the default branch when stale
inputs:
  python-version:
    description: Python version used by the fuzzer
    required: true
  seeds:
    description: Inclusive seed range in the corpus
    required: true
outputs:
  path:
    description: Directory containing the sources, if available
    value: ${{ steps.download.outputs.download-path || steps.prepare.outputs.path }}
runs:
  using: composite
  steps:
    - name: Find or generate the fuzz corpus
      id: prepare
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        UV_PYTHON: ${{ inputs.python-version }}
        FUZZ_SEEDS: ${{ inputs.seeds }}
      run: |
        uv run --project="$GITHUB_ACTION_PATH" --locked --no-dev \
          python "$GITHUB_ACTION_PATH/prepare_corpus.py" "$FUZZ_SEEDS" >> "$GITHUB_OUTPUT"
    - name: Download the fuzz corpus
      id: download
      if: ${{ steps.prepare.outputs.run-id }}
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        github-token: ${{ github.token }}
        run-id: ${{ steps.prepare.outputs.run-id }}
        name: ${{ steps.prepare.outputs.name }}
        path: ${{ runner.temp }}/fuzz-corpus
    - name: Upload the fuzz corpus
      if: ${{ steps.prepare.outputs.path }}
      continue-on-error: true
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ steps.prepare.outputs.name }}
        path: ${{ steps.prepare.outputs.path }}
        if-no-files-found: error
        overwrite: true
