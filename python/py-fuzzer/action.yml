name: Prepare a fuzz corpus
description: Reuse a fixed-seed Python corpus and publish it from the default branch when stale
inputs:
  python-version:
    description: Python version used by the fuzzer
    required: true
  seeds:
    description: Inclusive seed range in the corpus
    required: true
outputs:
  path:
    description: Directory containing the sources, if available
    value: ${{ steps.download.outputs.download-path || steps.generate.outputs.path }}
runs:
  using: composite
  steps:
    - name: Find a matching fuzz corpus on the default branch
      id: corpus
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        FUZZ_PYTHON: ${{ inputs.python-version }}
        FUZZ_SEEDS: ${{ inputs.seeds }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        # Python patch releases can produce different sources for the same seed.
        python_version=$(uv run --no-project --python="$FUZZ_PYTHON" python -c 'import platform; print(platform.python_version())')
        echo "python-version=$python_version" >> "$GITHUB_OUTPUT"
        generator=$(uv tree --frozen --project="$GITHUB_ACTION_PATH" --python="$python_version" \
          --package pysource-codegen --color never | sha256sum)
        # Bump the format version if the generator arguments or file layout change.
        name="py-fuzzer-corpus-v1-$python_version-$FUZZ_SEEDS-${generator%% *}"
        echo "name=$name" >> "$GITHUB_OUTPUT"

        runs=$(gh api --paginate -X GET "repos/$GITHUB_REPOSITORY/actions/artifacts" -f name="$name" \
          --jq '.artifacts[] | select(.expired == false) | .workflow_run.id')
        workflow=${GITHUB_WORKFLOW_REF#"$GITHUB_REPOSITORY/"}
        for run in $runs; do
          producer=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run")
          # A PR, including one from a fork branch named `main`, can upload an artifact with this name.
          if jq -e --arg workflow "${workflow%%@*}" --arg branch "$DEFAULT_BRANCH" '
            .path == $workflow and .head_branch == $branch and (.event == "push" or .event == "schedule")
          ' <<< "$producer" > /dev/null; then
            echo "run-id=$run" >> "$GITHUB_OUTPUT"
            break
          fi
        done
    - name: Download the fuzz corpus
      id: download
      if: ${{ steps.corpus.outputs.run-id }}
      continue-on-error: true
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        github-token: ${{ github.token }}
        run-id: ${{ steps.corpus.outputs.run-id }}
        name: ${{ steps.corpus.outputs.name }}
        path: ${{ runner.temp }}/fuzz-corpus
    - name: Generate the fuzz corpus
      id: generate
      if: >-
        (github.event_name == 'push' || github.event_name == 'schedule') &&
        github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
        !steps.corpus.outputs.run-id
      shell: bash
      env:
        FUZZ_PYTHON: ${{ steps.corpus.outputs.python-version }}
        FUZZ_SEEDS: ${{ inputs.seeds }}
      run: |
        uv run --python="$FUZZ_PYTHON" --project="$GITHUB_ACTION_PATH" --locked --no-dev \
          generate-fuzz-corpus --output-dir="$RUNNER_TEMP/fuzz-corpus" "$FUZZ_SEEDS"
        echo "path=$RUNNER_TEMP/fuzz-corpus" >> "$GITHUB_OUTPUT"
    - name: Upload the fuzz corpus
      if: ${{ steps.generate.outputs.path }}
      continue-on-error: true
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ steps.corpus.outputs.name }}
        path: ${{ steps.generate.outputs.path }}
        if-no-files-found: error
        overwrite: true
