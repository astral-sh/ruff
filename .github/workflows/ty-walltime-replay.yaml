name: ty walltime replay

on:
  push:
    branches: [alex/ty-codspeed-replay-30764-base]
  pull_request:
    branches: [alex/ty-codspeed-replay-30764-base]

permissions:
  contents: read

env:
  UV_LOCKED: 1
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10

jobs:
  benchmarks-walltime-ty-build:
    name: "Build replay (${{ matrix.bench }})"
    runs-on: depot-ubuntu-24.04-4
    strategy:
      fail-fast: false
      matrix:
        include:
          - bench: fastapi
            rev: "0fc43484015ce7a570f8588053ff8a684ff44d85"
    timeout-minutes: 20
    steps:
      - name: "Checkout Branch"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the replay benchmark at the historical ty revision
        env:
          TY_REV: ${{ matrix.rev }}
        run: |
          bench=crates/ruff_benchmark/benches/ty_walltime.rs
          cp "$bench" "$RUNNER_TEMP/ty_walltime.rs"
          git fetch --no-tags --depth=1 origin "$TY_REV"
          git checkout --detach "$TY_REV"
          cp "$RUNNER_TEMP/ty_walltime.rs" "$bench"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: $/.github/actions/setup-ruff-workspace
        with:
          enable-cache: auto

      - name: "Install Rust toolchain"
        run: rustup show

      - name: "Build benchmarks"
        run: uv run --only-dev cargo codspeed build -m walltime --features "codspeed,ty_ide,ty_walltime" --profile profiling --no-default-features -p ruff_benchmark --bench ty_walltime

      - name: "Upload benchmark binary"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ty-replay-${{ matrix.bench }}
          compression-level: 1
          path: target/codspeed
          if-no-files-found: "error"
          retention-days: 1

  benchmarks-walltime-ty-run:
    name: "Replay (${{ matrix.bench }})"
    needs: benchmarks-walltime-ty-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - bench: pandas_stubs
            rev: "bb18253b84c44d4c9517564415b27377ae8c14f0"
          - bench: fastapi
            rev: "0fc43484015ce7a570f8588053ff8a684ff44d85"
          - bench: scikit_learn
            rev: "b09f331a3a48dcce09c88df02bf1474b6e9b20dd"
    runs-on: codspeed-macro-x64-ryzen-9950x-ubuntu-24-04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read # required for actions/checkout
      id-token: write # required for OIDC authentication with CodSpeed
    steps:
      - name: "Checkout Branch"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use the Ruff configuration that shipped with this ty binary
        env:
          TY_REV: ${{ matrix.rev }}
        run: |
          git fetch --no-tags --depth=1 origin "$TY_REV"
          git restore --source="$TY_REV" --worktree -- pyproject.toml uv.lock

      - uses: $/.github/actions/setup-ruff-workspace
        with:
          enable-cache: auto

      - name: "Download benchmark binary"
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ matrix.bench == 'fastapi' && github.run_id || github.event_name == 'push' && '45058690984' || '45058803097' }}
          name: ty-replay-${{ matrix.bench }}
          path: target/codspeed

      - name: "Restore binary permissions"
        # codspeed keeps changing the paths to the executable, so we have to be a bit more flexible
        run: find target/codspeed -type f -exec chmod +x {} +

      - name: "Run benchmarks"
        uses: CodSpeedHQ/action@af75f77f17a054769abefaa42fe8dc2975469b5f # v5.6.3
        env:
          # enabling walltime flamegraphs adds ~6 minutes to the CI time, and they don't
          # appear to provide much useful insight for our walltime benchmarks right now
          # (see https://github.com/astral-sh/ruff/pull/20419)
          CODSPEED_PERF_ENABLED: false
          # Benchmarks manage any disposable uv environments they create.
          UV_LOCKED: 0
          BENCH_FILTER: ${{ matrix.bench }}
        with:
          mode: walltime
          run: uv run --locked --only-dev cargo codspeed run -m walltime --bench ty_walltime "$BENCH_FILTER"
