name: Measure native Rust cache
run-name: ${{ inputs.phase }} / ${{ inputs.suite }}
'on':
  workflow_dispatch:
    inputs:
      phase:
        type: choice
        options:
        - seed
        - warm
        default: warm
        required: true
      suite:
        type: string
        default: all
        required: true
      schema-changed:
        type: string
        default: 'false'
        required: false
permissions:
  contents: read
jobs:
  walltime-build-before:
    name: walltime-build / before
    runs-on: depot-ubuntu-22.04-arm-4
    if: ${{ (inputs.suite == 'all' || inputs.suite == 'walltime-build') }}
    timeout-minutes: 20
    steps:
    - name: Checkout Branch
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: 7a8f63f0d71a1d381f99652a5fee3b043b32e8e6
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      with:
        save-if: ${{ inputs.phase == 'seed' }}
        prefix-key: ruff-native-20261024-v1-walltime-build-before
      name: Restore Rust cache
      id: rust-cache
    - name: Record Rust cache availability
      if: ${{ inputs.phase == 'warm' }}
      shell: bash
      env:
        CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
        EXPECTED_HIT: 'true'
      run: 'echo "Rust cache exact hit: ${CACHE_HIT:-false}"

        test "${CACHE_HIT:-false}" = "$EXPECTED_HIT"'
    - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
      with:
        version: 0.13.4
        checksum: 1ae72b4718729e2ccc4f1ae2c6d1e531ca8467800e0546e9130b3886023a60ab
    - name: Install Rust toolchain
      run: rustup show
    - name: Build benchmarks
      run: uv run --only-dev cargo codspeed build -m walltime --features "codspeed,ty_ide,ty_walltime" --profile profiling
        --no-default-features -p ruff_benchmark --bench ty_walltime --bench ty_script --bench ty_ide
    - name: Upload benchmark binary
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: benchmarks-walltime-binary-walltime-build-before
        compression-level: 1
        path: target/codspeed
        if-no-files-found: error
        retention-days: 1
    env:
      UV_LOCKED: 1
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      CARGO_PROFILE_DEV_LTO: 'false'
      CARGO_PROFILE_DEV_OPT_LEVEL: 0
      CARGO_TERM_COLOR: always
      HAWK_VERSION: 0.1.15
      RUSTUP_MAX_RETRIES: 10
      PACKAGE_NAME: ruff
      PYTHON_VERSION: '3.14'
      NEXTEST_PROFILE: ci
      MDTEST_EXTERNAL: '1'
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
  walltime-build-after:
    name: walltime-build / after
    runs-on: depot-ubuntu-22.04-arm-4
    if: ${{ (inputs.suite == 'all' || inputs.suite == 'walltime-build') }}
    timeout-minutes: 20
    steps:
    - name: Checkout Branch
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: 7a8f63f0d71a1d381f99652a5fee3b043b32e8e6
    - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
      with:
        version: 0.13.5
        checksum: 4bb69cf95ed13f23713bb7bc09f241896ea0c75b7c557e615a20604b82f9c403
    - name: Install Rust toolchain
      run: rustup show
    - uses: astral-sh/github-actions/rust-workspace-cache@4f88db2c55c0e0588aaae819ef0ef95e4924c753
      with:
        cache-workspace-crates: 'false'
        save-if: ${{ inputs.phase == 'seed' }}
        prefix-key: ruff-native-20261024-v1-walltime-build-after
      name: Restore Rust cache
      id: rust-cache
    - name: Record Rust cache availability
      if: ${{ inputs.phase == 'warm' }}
      shell: bash
      env:
        CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
        EXPECTED_HIT: 'true'
      run: 'echo "Rust cache exact hit: ${CACHE_HIT:-false}"

        test "${CACHE_HIT:-false}" = "$EXPECTED_HIT"'
    - name: Build benchmarks
      run: uv run --only-dev cargo codspeed build -m walltime --features "codspeed,ty_ide,ty_walltime" --profile profiling
        --no-default-features -p ruff_benchmark --bench ty_walltime --bench ty_script --bench ty_ide
    - name: Upload benchmark binary
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: benchmarks-walltime-binary-walltime-build-after
        compression-level: 1
        path: target/codspeed
        if-no-files-found: error
        retention-days: 1
    env:
      UV_LOCKED: 1
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      CARGO_PROFILE_DEV_LTO: 'false'
      CARGO_PROFILE_DEV_OPT_LEVEL: 0
      CARGO_TERM_COLOR: always
      HAWK_VERSION: 0.1.15
      RUSTUP_MAX_RETRIES: 10
      PACKAGE_NAME: ruff
      PYTHON_VERSION: '3.14'
      NEXTEST_PROFILE: ci
      MDTEST_EXTERNAL: '1'
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
