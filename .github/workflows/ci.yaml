          add-job-id-key: "false"
        name: Restore Rust cache
        id: rust-cache
      - name: Record Rust cache availability
        env:
          CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
        run: 'echo "Rust cache exact hit: ${CACHE_HIT:-false}"

          test "${CACHE_HIT:-false}" = true'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: 0.13.4
          checksum: 2b428396f12572d4429cf210ca234dd599a33b3af0958a4d5ed569d63e3f344f
      - name: Build benchmarks
        run:
          uv run --only-dev cargo codspeed build -m simulation -m memory --features "codspeed,ruff_instrumented" --profile
          profiling --no-default-features -p ruff_benchmark --bench formatter --bench lexer --bench linter --bench parser
  seed-typing-before:
    name: typing / before
    runs-on: ${{ github.repository == 'astral-sh/ruff' && 'depot-ubuntu-22.04-32' || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: ruff
          persist-credentials: false
      - name: Fetch full history without tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: "gh auth setup-git

          git -C ruff fetch --no-tags --filter=blob:none --unshallow origin

          "
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: python/typing
          ref: ${{ env.CONFORMANCE_SUITE_COMMIT }}
          path: typing
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: ruff
          prefix-key: ruff-simple-extra-20261024-v1-typing-before
          add-job-id-key: "false"
          save-if: "true"
        name: Restore Rust cache
        id: rust-cache
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Rust toolchain
        run: rustup show
      - name: Compute diagnostic diff
        shell: bash
        run:
          "# Build the executable for the old and new commit\n(\n  cd ruff\n\n  echo \"new commit\"\n  git rev-list --format=%s\
          \ --max-count=1 \"$GITHUB_SHA\"\n  cargo build --bin ty\n  mv target/debug/ty ty-new\n\n  # The first parent contains\
          \ any preceding layers in a stacked pull request.\n  MERGE_BASE=\"$(git rev-parse \"${GITHUB_SHA}^1\")\"\n  git checkout\
          \ -b old_commit \"$MERGE_BASE\"\n  echo \"old commit (merge base)\"\n  git rev-list --format=%s --max-count=1 old_commit\n\
          \  cargo build --bin ty\n  mv target/debug/ty ty-old\n)\n\n(\n  echo \"Creating comment with conformance comparison\"\
          \n  cd ruff\n  git switch - --detach\n\n  python \"./scripts/conformance.py\" \\\n   --old-ty \"./ty-old\" \\\n  \
          \ --new-ty \"./ty-new\" \\\n   --tests-path \"${GITHUB_WORKSPACE}/typing/conformance/\" \\\n   --python-version \"\
          $PYTHON_VERSION\" \\\n   --output ../typing_conformance_diagnostics.diff\n)\n"
      - name: Upload diff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: typing_conformance_diagnostics_diff
          path: typing_conformance_diagnostics.diff
    if: ${{ inputs.phase == 'seed' && (inputs.suite == 'typing' || inputs.suite == 'all') }}
    env:
      UV_LOCKED: 1
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      CARGO_TERM_COLOR: always
      RUSTUP_MAX_RETRIES: 10
      RUST_BACKTRACE: 1
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_DEV_LTO: "false"
      CARGO_PROFILE_DEV_OPT_LEVEL: 0
      CONFORMANCE_SUITE_COMMIT: d06c5dd6bbae4a39eb7cb0210c5b2099aafd8032
      PYTHON_VERSION: 3.12
    permissions:
      contents: read
