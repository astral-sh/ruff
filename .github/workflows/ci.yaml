name: Compare Ruff release codegen units

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ruff-cgu-comparison-${{ github.ref }}
  cancel-in-progress: false

env:
  ACTIONS_CACHE_MODE: none
  RUSTUP_TOOLCHAIN: "1.99.0"
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  RUSTUP_MAX_RETRIES: "10"

jobs:
  compare:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: depot-ubuntu-24.04-8
            python-architecture: x64
          - target: aarch64-apple-darwin
            runner: namespace-profile-macos-15
            python-architecture: arm64
          - target: x86_64-pc-windows-msvc
            runner: namespace-profile-windows-2022-x86-64-16x32
            python-architecture: x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          cache: ""
          python-version: "3.13"
          architecture: ${{ matrix.python-architecture }}
      - name: Install measurement tools
        run: python -m pip install psutil==7.0.0
      - name: Install Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component llvm-tools-preview
      - name: Compare complete PGO builds and runtime
        run: python -u scripts/compare_codegen_units.py
        env:
          UV_CGU_TARGET: ${{ matrix.target }}
          UV_CGU_ROOT: ${{ runner.temp }}/ruff-cgu-comparison
      - name: Upload measurements and binaries
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ruff-cgu-comparison-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/ruff-cgu-comparison/evidence
            ${{ runner.temp }}/ruff-cgu-comparison/binaries
          if-no-files-found: warn
