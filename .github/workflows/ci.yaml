      PYTHON_VERSION: 3.12
      CARGO_UNSTABLE_CHECKSUM_FRESHNESS: 'true'
      RUSTC_BOOTSTRAP: '1'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        path: ruff
        persist-credentials: false
    - name: Fetch full history without tags
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh auth setup-git
        git -C ruff fetch --no-tags --filter=blob:none --unshallow origin
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: python/typing
        ref: ${{ env.CONFORMANCE_SUITE_COMMIT }}
        path: typing
        persist-credentials: false
    - name: Install Rust toolchain
      run: rustup show
      working-directory: ruff
    - uses: astral-sh/github-actions/rust-workspace-cache@3c9fe5db47e144ea224b57565e3ab1ab769ef41d
      with:
        workspace: ruff
        prefix-key: ruff-ws-measure-20261022-after
        save-if: 'true'
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    - name: Install mold
      uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444
    - name: Compute diagnostic diff
      shell: bash
      run: |
        # Build the executable for the old and new commit
        (
          cd ruff

          echo "new commit"
          git rev-list --format=%s --max-count=1 "$GITHUB_SHA"
          cargo build --bin ty
          mv target/debug/ty ty-new

          # The first parent contains any preceding layers in a stacked pull request.
          MERGE_BASE="$(git rev-parse "${GITHUB_SHA}^1")"
          git checkout -b old_commit "$MERGE_BASE"
          echo "old commit (merge base)"
          git rev-list --format=%s --max-count=1 old_commit
          cargo build --bin ty
          mv target/debug/ty ty-old
        )

        (
          echo "Creating comment with conformance comparison"
          cd ruff
          git switch - --detach

          python "./scripts/conformance.py" \
           --old-ty "./ty-old" \
           --new-ty "./ty-new" \
           --tests-path "${GITHUB_WORKSPACE}/typing/conformance/" \
           --python-version "$PYTHON_VERSION" \
           --output ../typing_conformance_diagnostics.diff
        )
    - name: Upload diff
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: typing_conformance_diagnostics_diff
        path: typing_conformance_diagnostics.diff
