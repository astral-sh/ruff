        version: 0.13.4
        checksum: 2b428396f12572d4429cf210ca234dd599a33b3af0958a4d5ed569d63e3f344f
        enable-cache: 'true'
        cache-python: true
    - name: Run tests
      run: uv run --locked --only-dev cargo nextest run --cargo-profile profiling --all-features
    - name: Run doctests
      run: cargo test --doc --profile profiling --all-features
    permissions:
