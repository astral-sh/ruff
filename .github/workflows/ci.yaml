name: Diagnose Ruff workspace cache
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ruff-cache-root-cause-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  diagnose:
    name: Diagnose warm workspace cache
    runs-on: ${{ github.repository == 'astral-sh/ruff' && 'depot-ubuntu-22.04-16' || 'ubuntu-latest' }}
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      UV_LOCKED: 1
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      CARGO_PROFILE_DEV_LTO: 'false'
      CARGO_PROFILE_DEV_OPT_LEVEL: 0
      CARGO_TERM_COLOR: always
      HAWK_VERSION: 0.1.15
      RUSTUP_MAX_RETRIES: 10
      PACKAGE_NAME: ruff
      PYTHON_VERSION: '3.14'
      NEXTEST_PROFILE: ci
      MDTEST_EXTERNAL: '1'
      CARGO_UNSTABLE_CHECKSUM_FRESHNESS: 'true'
      RUSTC_BOOTSTRAP: '1'
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: 461120ebea87b783888cdba1ed17e342b373d09f
    - name: Install Rust toolchain
      run: rustup show
    - uses: astral-sh/github-actions/rust-workspace-cache@3c9fe5db47e144ea224b57565e3ab1ab769ef41d
      with:
        key: ruff-linux-debug
        add-job-id-key: 'false'
        save-if: 'false'
        prefix-key: ruff-ws-measure-20261022-after
      id: rust-cache
    - name: Install mold
      uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444
    - name: Require exact measured cache
      env:
        CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
      run: test "$CACHE_HIT" = true
    - name: Record restored artifact sizes
      run: "python3 - <<'PYCODE'\nfrom pathlib import Path\nfiles=[(p,p.stat().st_size) for p in Path('target/debug').rglob('*')\
        \ if p.is_file()]\nprint('Total restored target/debug bytes:',sum(n for p,n in files))\nfor p,n in sorted(files,key=lambda\
        \ x:x[1],reverse=True)[:20]:print(n,p)\nfor pattern in ['crates/ruff_unicode_names2/build.rs','crates/ty_vendored/build.rs','target/debug/build/ruff_unicode_names2-*/output','target/debug/build/ty_vendored-*/output']:\n\
        \ for p in Path('.').glob(pattern):print('mtime_ns',p.stat().st_mtime_ns,p)\nPYCODE"
    - name: Trace ty test build
      env:
        CARGO_TERM_COLOR: never
      run: cargo test -p ty_python_semantic --test mdtest --no-run --locked -vv
    - name: Trace workspace test build
      env:
        CARGO_TERM_COLOR: never
      run: cargo test --workspace --all-features --no-run --locked -vv
