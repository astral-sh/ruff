  parser-before:
    name: parser / before
    runs-on: ${{ github.repository == 'astral-sh/ruff' && 'github-ubuntu-24.04-x86_64-4' || 'ubuntu-latest' }}
    if: ${{ inputs.phase == 'warm' && (inputs.suite == 'all' || inputs.suite == 'parser') }}
    timeout-minutes: 20
    env:
      UV_LOCKED: 1
      CARGO_INCREMENTAL: 0
