name: Iterate Ruff workspace cache
"on":
  workflow_dispatch:
    inputs:
      phase:
        type: choice
        options:
          - warm
          - seed
        default: warm
        required: true
      suite:
        type: choice
        options:
          - linux
          - ecosystem
        default: linux
        required: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  UV_LOCKED: 1
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_PROFILE_DEV_LTO: "false"
  CARGO_PROFILE_DEV_OPT_LEVEL: 0
  CARGO_TERM_COLOR: always
  HAWK_VERSION: 0.1.15
  RUSTUP_MAX_RETRIES: 10
  PACKAGE_NAME: ruff
  PYTHON_VERSION: "3.14"
  NEXTEST_PROFILE: ci
  MDTEST_EXTERNAL: "1"
jobs:
  linux-deps:
    name: Linux tests / deps
    runs-on: depot-ubuntu-22.04-16
    if: ${{ inputs.suite == 'linux' || inputs.phase == 'seed' }}
    timeout-minutes: 20
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare cache input helper
        run: cp .github/actions/cache-input-mtimes/inputs.py "$RUNNER_TEMP/cache-input-mtimes.py"
      - name: Install Rust toolchain
        run: rustup show
      - name: Restore Rust cache
        id: rust-cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          prefix-key: ruff-iterate-20261022-v2-deps
          key: ruff-linux-debug
          add-job-id-key: "false"
          save-if: ${{ inputs.phase == 'seed' }}
          cache-workspace-crates: "false"
      - name: Require warm cache hit
        if: ${{ inputs.phase == 'warm' }}
        env:
          CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
        run: test "$CACHE_HIT" = true
      - name: Install mold
        uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: 0.13.4
          checksum: 2b428396f12572d4429cf210ca234dd599a33b3af0958a4d5ed569d63e3f344f
          enable-cache: "true"
          cache-python: true
      - name: ty mdtests (GitHub annotations)
        env:
          NO_COLOR: 1
          MDTEST_GITHUB_ANNOTATIONS_FORMAT: 1
        run: cargo test -p ty_python_semantic --test mdtest || true
      - name: Run tests
        run: uv run --locked --only-dev cargo insta test --all-features --unreferenced reject --test-runner nextest --disable-nextest-doctest
      - name: Run doctests
        run: cargo test --doc --all-features
      - name: Check parser without stacker
        run: cargo check --locked -p ruff_python_parser --no-default-features --all-targets
      - name: Dogfood ty on py-fuzzer
        run:
          uv run --quiet --python="${PYTHON_VERSION}" --project=./python/py-fuzzer cargo run --quiet -p ty check --project=./python/py-fuzzer
          --color=always
      - name: Dogfood ty on ty_benchmark
        run:
          uv run --quiet --project=./scripts/ty_benchmark cargo run --quiet -p ty check --project=./scripts/ty_benchmark
          --color=always
      - name: Dogfood ty on scripts
        env:
          TY_UV: scripts
          UV_LOCKED: "true"
          UV_PYTHON: ${{ env.PYTHON_VERSION }}
        run:
          'uv run --locked scripts/check-scripts.py --write-ty-args-file "$RUNNER_TEMP/script-paths.txt"

          cargo run --quiet -p ty check "@$RUNNER_TEMP/script-paths.txt" --color=always

          '
      - run: cargo doc --all --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run:
          cargo doc --no-deps -p ty_python_semantic -p ty_python_core -p ty_module_resolver -p ty_site_packages -p ty_combine
          -p ty_project -p ty_ide -p ty_wasm -p ty_vendored -p ty_static -p ty -p ty_test -p ruff_db -p ruff_python_formatter
          --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings
  linux-workspace:
    name: Linux tests / workspace
    runs-on: depot-ubuntu-22.04-16
    if: ${{ inputs.suite == 'linux' || inputs.phase == 'seed' }}
    timeout-minutes: 20
    env:
      CARGO_UNSTABLE_CHECKSUM_FRESHNESS: "true"
      RUSTC_BOOTSTRAP: "1"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare cache input helper
        run: cp .github/actions/cache-input-mtimes/inputs.py "$RUNNER_TEMP/cache-input-mtimes.py"
      - name: Install Rust toolchain
        run: rustup show
      - name: Restore Rust cache
        id: rust-cache
        uses: astral-sh/github-actions/rust-workspace-cache@3c9fe5db47e144ea224b57565e3ab1ab769ef41d
        with:
          prefix-key: ruff-iterate-20261022-v2-workspace
          key: ruff-linux-debug
          add-job-id-key: "false"
          save-if: ${{ inputs.phase == 'seed' }}
      - name: Require warm cache hit
        if: ${{ inputs.phase == 'warm' }}
        env:
          CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
        run: test "$CACHE_HIT" = true
      - name: Install mold
        uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: 0.13.4
          checksum: 2b428396f12572d4429cf210ca234dd599a33b3af0958a4d5ed569d63e3f344f
          enable-cache: "true"
          cache-python: true
      - name: ty mdtests (GitHub annotations)
        env:
          NO_COLOR: 1
          MDTEST_GITHUB_ANNOTATIONS_FORMAT: 1
        run: cargo test -p ty_python_semantic --test mdtest || true
      - name: Run tests
        run: uv run --locked --only-dev cargo insta test --all-features --unreferenced reject --test-runner nextest --disable-nextest-doctest
      - name: Run doctests
        run: cargo test --doc --all-features
      - name: Check parser without stacker
        run: cargo check --locked -p ruff_python_parser --no-default-features --all-targets
      - name: Dogfood ty on py-fuzzer
        run:
          uv run --quiet --python="${PYTHON_VERSION}" --project=./python/py-fuzzer cargo run --quiet -p ty check --project=./python/py-fuzzer
          --color=always
      - name: Dogfood ty on ty_benchmark
        run:
          uv run --quiet --project=./scripts/ty_benchmark cargo run --quiet -p ty check --project=./scripts/ty_benchmark
          --color=always
      - name: Dogfood ty on scripts
        env:
          TY_UV: scripts
          UV_LOCKED: "true"
          UV_PYTHON: ${{ env.PYTHON_VERSION }}
        run:
          'uv run --locked scripts/check-scripts.py --write-ty-args-file "$RUNNER_TEMP/script-paths.txt"

          cargo run --quiet -p ty check "@$RUNNER_TEMP/script-paths.txt" --color=always

          '
      - run: cargo doc --all --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run:
          cargo doc --no-deps -p ty_python_semantic -p ty_python_core -p ty_module_resolver -p ty_site_packages -p ty_combine
          -p ty_project -p ty_ide -p ty_wasm -p ty_vendored -p ty_static -p ty -p ty_test -p ruff_db -p ruff_python_formatter
          --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings
  linux-mtimes:
    name: Linux tests / mtimes
    runs-on: depot-ubuntu-22.04-16
    if: ${{ inputs.suite == 'linux' || inputs.phase == 'seed' }}
    timeout-minutes: 20
    env:
      CARGO_UNSTABLE_CHECKSUM_FRESHNESS: "true"
      RUSTC_BOOTSTRAP: "1"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare cache input helper
        run: cp .github/actions/cache-input-mtimes/inputs.py "$RUNNER_TEMP/cache-input-mtimes.py"
      - name: Install Rust toolchain
        run: rustup show
      - name: Restore Rust cache
        id: rust-cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          prefix-key: ruff-iterate-20261022-v2-mtimes
          key: ruff-linux-debug
          add-job-id-key: "false"
          save-if: ${{ inputs.phase == 'seed' }}
          cache-workspace-crates: "true"
          cache-directories: .rust-cache-inputs
      - name: Track workspace artifacts
        uses: astral-sh/github-actions/rust-workspace-cache/prune@3c9fe5db47e144ea224b57565e3ab1ab769ef41d
        with:
          workspace: .
          target-directory: target
          profile: debug
          enabled: ${{ inputs.phase == 'seed' && steps.rust-cache.outputs.cache-hit != 'true' }}
      - name: Restore matching input timestamps
        run: python3 "$RUNNER_TEMP/cache-input-mtimes.py" restore .rust-cache-inputs/manifest.json
      - name: Require warm cache hit
        if: ${{ inputs.phase == 'warm' }}
        env:
          CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
        run: test "$CACHE_HIT" = true
      - name: Install mold
        uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: 0.13.4
          checksum: 2b428396f12572d4429cf210ca234dd599a33b3af0958a4d5ed569d63e3f344f
          enable-cache: "true"
          cache-python: true
      - name: ty mdtests (GitHub annotations)
        env:
          NO_COLOR: 1
          MDTEST_GITHUB_ANNOTATIONS_FORMAT: 1
        run: cargo test -p ty_python_semantic --test mdtest || true
      - name: Run tests
        run: uv run --locked --only-dev cargo insta test --all-features --unreferenced reject --test-runner nextest --disable-nextest-doctest
      - name: Run doctests
        run: cargo test --doc --all-features
      - name: Check parser without stacker
        run: cargo check --locked -p ruff_python_parser --no-default-features --all-targets
      - name: Dogfood ty on py-fuzzer
        run:
          uv run --quiet --python="${PYTHON_VERSION}" --project=./python/py-fuzzer cargo run --quiet -p ty check --project=./python/py-fuzzer
          --color=always
      - name: Dogfood ty on ty_benchmark
        run:
          uv run --quiet --project=./scripts/ty_benchmark cargo run --quiet -p ty check --project=./scripts/ty_benchmark
          --color=always
      - name: Dogfood ty on scripts
        env:
          TY_UV: scripts
          UV_LOCKED: "true"
          UV_PYTHON: ${{ env.PYTHON_VERSION }}
        run:
          'uv run --locked scripts/check-scripts.py --write-ty-args-file "$RUNNER_TEMP/script-paths.txt"

          cargo run --quiet -p ty check "@$RUNNER_TEMP/script-paths.txt" --color=always

          '
      - run: cargo doc --all --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run:
          cargo doc --no-deps -p ty_python_semantic -p ty_python_core -p ty_module_resolver -p ty_site_packages -p ty_combine
          -p ty_project -p ty_ide -p ty_wasm -p ty_vendored -p ty_static -p ty -p ty_test -p ruff_db -p ruff_python_formatter
          --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Record build input timestamps
        if: ${{ inputs.phase == 'seed' && steps.rust-cache.outputs.cache-hit != 'true' }}
        run: python3 "$RUNNER_TEMP/cache-input-mtimes.py" save .rust-cache-inputs/manifest.json
  seed-narrow:
    name: Seed Ruff binary cache
    if: ${{ inputs.phase == 'seed' }}
    runs-on: depot-ubuntu-24.04-8
    timeout-minutes: 20
    env:
      CARGO_UNSTABLE_CHECKSUM_FRESHNESS: "true"
      RUSTC_BOOTSTRAP: "1"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare cache input helper
        run: cp .github/actions/cache-input-mtimes/inputs.py "$RUNNER_TEMP/cache-input-mtimes.py"
      - name: Install Rust toolchain
        run: rustup show
      - name: Install mold
        uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444
      - name: Restore Rust cache
        id: rust-cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          prefix-key: ruff-iterate-20261022-v2-narrow
          key: ruff-linux-debug
          add-job-id-key: "false"
          save-if: ${{ inputs.phase == 'seed' }}
          cache-workspace-crates: "true"
          cache-directories: .rust-cache-inputs
      - name: Track workspace artifacts
        uses: astral-sh/github-actions/rust-workspace-cache/prune@3c9fe5db47e144ea224b57565e3ab1ab769ef41d
        with:
          workspace: .
          target-directory: target
          profile: debug
          enabled: ${{ inputs.phase == 'seed' && steps.rust-cache.outputs.cache-hit != 'true' }}
      - name: Restore matching input timestamps
        run: python3 "$RUNNER_TEMP/cache-input-mtimes.py" restore .rust-cache-inputs/manifest.json
      - name: Require warm cache hit
        if: ${{ inputs.phase == 'warm' }}
        env:
          CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
        run: test "$CACHE_HIT" = true
      - name: Build Ruff
        run: cargo build --locked
      - name: Record build input timestamps
        if: ${{ inputs.phase == 'seed' && steps.rust-cache.outputs.cache-hit != 'true' }}
        run: python3 "$RUNNER_TEMP/cache-input-mtimes.py" save .rust-cache-inputs/manifest.json
  ecosystem-deps:
    name: Ecosystem builds / deps
    runs-on: depot-ubuntu-24.04-8
    if: ${{ inputs.phase == 'warm' && inputs.suite == 'ecosystem' }}
    timeout-minutes: 20
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - name: Check out baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 7a8f63f0d71a1d381f99652a5fee3b043b32e8e6
          persist-credentials: false
      - name: Prepare cache input helper
        run:
          "cat > \"$RUNNER_TEMP/cache-input-mtimes.py\" <<'PYCODE'\n# /// script\n# requires-python = \">=3.11\"\n# dependencies\
          \ = []\n# ///\n\"\"\"Record source timestamps and restore them only for matching inputs.\"\"\"\n\nfrom __future__\
          \ import annotations\n\nimport argparse\nimport hashlib\nimport json\nimport os\nimport stat\nimport subprocess\n\
          import time\nfrom pathlib import Path\n\n\ndef tracked_paths(root):\n    metadata = json.loads(\n        subprocess.check_output(\n\
          \            [\"cargo\", \"metadata\", \"--no-deps\", \"--format-version\", \"1\", \"--offline\"],\n            cwd=root,\n\
          \        )\n    )\n    packages = [\n        str(Path(package[\"manifest_path\"]).parent.relative_to(root))\n    \
          \    for package in metadata[\"packages\"]\n        if any(\"custom-build\" in target[\"kind\"] for target in package[\"\
          targets\"])\n        and Path(package[\"manifest_path\"]).is_relative_to(root)\n    ]\n    if not packages:\n    \
          \    return []\n    output = subprocess.check_output(\n        [\"git\", \"ls-files\", \"-z\", \"--\", *packages],\
          \ cwd=root\n    )\n    return sorted({os.fsdecode(name) for name in output.split(b\"\\0\") if name})\n\n\ndef safe_path(root,\
          \ name):\n    relative = Path(name)\n    if relative.is_absolute() or \"..\" in relative.parts:\n        raise ValueError(f\"\
          Invalid cached input path: {name}\")\n    path = root / relative\n    if not path.resolve().is_relative_to(root):\n\
          \        return None\n    return path\n\n\ndef identity(path):\n    info = path.lstat()\n    if not stat.S_ISREG(info.st_mode):\n\
          \        return None\n    with path.open(\"rb\") as stream:\n        digest = hashlib.file_digest(stream, \"sha256\"\
          ).hexdigest()\n    return [digest, stat.S_IMODE(info.st_mode)]\n\n\ndef directory_entries(path):\n    return sorted(\n\
          \        (entry.name, stat.S_IFMT(entry.lstat().st_mode)) for entry in path.iterdir()\n    )\n\n\ndef scan(root):\n\
          \    files = {}\n    directories = set()\n    for name in tracked_paths(root):\n        path = safe_path(root, name)\n\
          \        if path is None or not path.exists():\n            continue\n        value = identity(path)\n        if value\
          \ is None:\n            continue\n        files[name] = {\"identity\": value, \"mtime_ns\": path.stat().st_mtime_ns}\n\
          \        for parent in path.parents:\n            if parent == root:\n                break\n            directories.add(parent)\n\
          \    return {\n        \"version\": 1,\n        \"files\": files,\n        \"directories\": {\n            str(path.relative_to(root)):\
          \ {\n                \"entries\": directory_entries(path),\n                \"mtime_ns\": path.stat().st_mtime_ns,\n\
          \            }\n            for path in sorted(directories)\n        },\n    }\n\n\ndef restore(root, saved):\n  \
          \  if saved[\"version\"] != 1:\n        raise ValueError(\"Unsupported input timestamp manifest\")\n    current =\
          \ scan(root)\n    restored = changed = 0\n    now = time.time_ns()\n    for name, record in current[\"files\"].items():\n\
          \        path = safe_path(root, name)\n        previous = saved[\"files\"].get(name)\n        if previous and record[\"\
          identity\"] == previous[\"identity\"]:\n            mtime = previous[\"mtime_ns\"]\n            restored += 1\n  \
          \      else:\n            # Changed inputs must stay newer than the restored build, including\n            # edits\
          \ made by tools that preserve their input's timestamp.\n            mtime = now\n            changed += 1\n      \
          \  os.utime(path, ns=(path.stat().st_atime_ns, mtime), follow_symlinks=False)\n    restored_directories = 0\n    for\
          \ name, record in current[\"directories\"].items():\n        path = safe_path(root, name)\n        previous = saved[\"\
          directories\"].get(name)\n        if previous and record[\"entries\"] == [\n            tuple(entry) for entry in\
          \ previous[\"entries\"]\n        ]:\n            mtime = previous[\"mtime_ns\"]\n            restored_directories\
          \ += 1\n        else:\n            mtime = now\n        os.utime(path, ns=(path.stat().st_atime_ns, mtime), follow_symlinks=False)\n\
          \    return {\n        \"restored_files\": restored,\n        \"changed_files\": changed,\n        \"restored_directories\"\
          : restored_directories,\n    }\n\n\ndef main():\n    parser = argparse.ArgumentParser()\n    parser.add_argument(\"\
          operation\", choices=[\"save\", \"restore\"])\n    parser.add_argument(\"manifest\", type=Path)\n    parser.add_argument(\"\
          --root\", type=Path, default=Path.cwd())\n    args = parser.parse_args()\n    root = args.root.resolve()\n    start\
          \ = time.monotonic()\n    if args.operation == \"save\":\n        data = scan(root)\n        args.manifest.parent.mkdir(parents=True,\
          \ exist_ok=True)\n        args.manifest.write_text(json.dumps(data, separators=(\",\", \":\")) + \"\\n\")\n      \
          \  result = {\n            \"saved_files\": len(data[\"files\"]),\n            \"manifest_bytes\": args.manifest.stat().st_size,\n\
          \        }\n    elif args.manifest.exists():\n        result = restore(root, json.loads(args.manifest.read_text()))\n\
          \    else:\n        result = {\"no_manifest\": True}\n    print(\n        json.dumps(\n            result | {\"operation\"\
          : args.operation, \"seconds\": time.monotonic() - start}\n        )\n    )\n\n\nif __name__ == \"__main__\":\n   \
          \ main()\nPYCODE\n"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          activate-environment: true
          version: 0.13.4
          checksum: 2b428396f12572d4429cf210ca234dd599a33b3af0958a4d5ed569d63e3f344f
      - name: Install Rust toolchain
        run: rustup show
      - name: Install mold
        uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444
      - name: Restore Rust cache
        id: rust-cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          prefix-key: ruff-iterate-20261022-v2-deps
          key: ruff-linux-debug
          add-job-id-key: "false"
          save-if: "false"
          cache-workspace-crates: "false"
      - name: Require warm cache hit
        if: ${{ inputs.phase == 'warm' }}
        env:
          CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
        run: test "$CACHE_HIT" = true
      - name: Build baseline version
        run: "cargo build --bin ruff

          mv target/debug/ruff target/debug/ruff-baseline

          "
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          clean: false
      - name: Build comparison version
        run: cargo build --bin ruff
  ecosystem-workspace:
    name: Ecosystem builds / workspace
    runs-on: depot-ubuntu-24.04-8
    if: ${{ inputs.phase == 'warm' && inputs.suite == 'ecosystem' }}
    timeout-minutes: 20
    env:
      CARGO_UNSTABLE_CHECKSUM_FRESHNESS: "true"
      RUSTC_BOOTSTRAP: "1"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - name: Check out baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 7a8f63f0d71a1d381f99652a5fee3b043b32e8e6
          persist-credentials: false
      - name: Prepare cache input helper
        run:
          "cat > \"$RUNNER_TEMP/cache-input-mtimes.py\" <<'PYCODE'\n# /// script\n# requires-python = \">=3.11\"\n# dependencies\
          \ = []\n# ///\n\"\"\"Record source timestamps and restore them only for matching inputs.\"\"\"\n\nfrom __future__\
          \ import annotations\n\nimport argparse\nimport hashlib\nimport json\nimport os\nimport stat\nimport subprocess\n\
          import time\nfrom pathlib import Path\n\n\ndef tracked_paths(root):\n    metadata = json.loads(\n        subprocess.check_output(\n\
          \            [\"cargo\", \"metadata\", \"--no-deps\", \"--format-version\", \"1\", \"--offline\"],\n            cwd=root,\n\
          \        )\n    )\n    packages = [\n        str(Path(package[\"manifest_path\"]).parent.relative_to(root))\n    \
          \    for package in metadata[\"packages\"]\n        if any(\"custom-build\" in target[\"kind\"] for target in package[\"\
          targets\"])\n        and Path(package[\"manifest_path\"]).is_relative_to(root)\n    ]\n    if not packages:\n    \
          \    return []\n    output = subprocess.check_output(\n        [\"git\", \"ls-files\", \"-z\", \"--\", *packages],\
          \ cwd=root\n    )\n    return sorted({os.fsdecode(name) for name in output.split(b\"\\0\") if name})\n\n\ndef safe_path(root,\
          \ name):\n    relative = Path(name)\n    if relative.is_absolute() or \"..\" in relative.parts:\n        raise ValueError(f\"\
          Invalid cached input path: {name}\")\n    path = root / relative\n    if not path.resolve().is_relative_to(root):\n\
