name: Measure Ruff cache reuse across source revisions
run-name: ${{ inputs.phase }} / ${{ inputs.suite }}
'on':
  workflow_dispatch:
    inputs:
      phase:
        type: choice
        options:
        - seed
        - warm
        default: warm
        required: true
      suite:
        type: string
        default: all
        required: true
      schema-changed:
        type: string
        default: 'false'
        required: false
permissions:
  contents: read
jobs:
  typing-before:
    name: typing / before
    runs-on: ${{ github.repository == 'astral-sh/ruff' && 'depot-ubuntu-22.04-32' || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        path: ruff
        persist-credentials: false
        ref: ${{ inputs.phase == 'seed' && 'acba99d527b8a9fd2e15490df42d0e6d744a4331' || '7a8f63f0d71a1d381f99652a5fee3b043b32e8e6'
          }}
    - name: Fetch full history without tags
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh auth setup-git
        git -C ruff fetch --no-tags --filter=blob:none --unshallow origin
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: python/typing
        ref: ${{ env.CONFORMANCE_SUITE_COMMIT }}
        path: typing
        persist-credentials: false
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      with:
        workspaces: ruff
        prefix-key: ruff-aged-typing-20261024-v1-before
        save-if: ${{ inputs.phase == 'seed' }}
      name: Restore Rust cache
      id: rust-cache
    - name: Record Rust cache availability
      if: ${{ inputs.phase == 'warm' }}
      shell: bash
      env:
        CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
        EXPECTED_HIT: 'true'
      run: |-
        echo "Rust cache exact hit: ${CACHE_HIT:-false}"
        test "${CACHE_HIT:-false}" = "$EXPECTED_HIT"
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    - name: Install Rust toolchain
      run: rustup show
    - name: Compute diagnostic diff
      shell: bash
      run: |
        # Build the executable for the old and new commit
        (
          cd ruff

          echo "new commit"
          git rev-list --format=%s --max-count=1 HEAD
          echo "Measured source revision: $(git rev-parse HEAD)"
          cargo build --bin ty
          mv target/debug/ty ty-new

            MERGE_BASE="$MEASURE_OLD_SOURCE"
          git checkout -b old_commit "$MERGE_BASE"
          echo "old commit (merge base)"
          git rev-list --format=%s --max-count=1 old_commit
          echo "Measured source revision: $(git rev-parse HEAD)"
          cargo build --bin ty
          mv target/debug/ty ty-old
        )

        (
          echo "Creating comment with conformance comparison"
          cd ruff
          git switch - --detach

          python "./scripts/conformance.py" \
           --old-ty "./ty-old" \
           --new-ty "./ty-new" \
           --tests-path "${GITHUB_WORKSPACE}/typing/conformance/" \
           --python-version "$PYTHON_VERSION" \
           --output ../typing_conformance_diagnostics.diff
        )
    - name: Upload diff
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: typing_conformance_diagnostics_diff-typing-before
        path: typing_conformance_diagnostics.diff
        retention-days: 1
    if: ${{ (inputs.suite == 'all' || inputs.suite == 'typing') }}
    env:
      UV_LOCKED: 1
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      CARGO_TERM_COLOR: always
      RUSTUP_MAX_RETRIES: 10
      RUST_BACKTRACE: 1
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_DEV_LTO: 'false'
      CARGO_PROFILE_DEV_OPT_LEVEL: 0
      CONFORMANCE_SUITE_COMMIT: d06c5dd6bbae4a39eb7cb0210c5b2099aafd8032
      PYTHON_VERSION: 3.12
      MEASURE_OLD_SOURCE: acba99d527b8a9fd2e15490df42d0e6d744a4331
    permissions:
      contents: read
  typing-current:
    name: typing / current
    runs-on: ${{ github.repository == 'astral-sh/ruff' && 'depot-ubuntu-22.04-32' || 'ubuntu-latest' }}
    timeout-minutes: 10
    env:
      UV_LOCKED: 1
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      CARGO_TERM_COLOR: always
