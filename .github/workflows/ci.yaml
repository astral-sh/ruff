name: Measure Ruff parser workspace cache
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  UV_LOCKED: 1
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_PROFILE_DEV_LTO: "false"
  CARGO_PROFILE_DEV_OPT_LEVEL: 0
  CARGO_TERM_COLOR: always
  HAWK_VERSION: 0.1.15
  RUSTUP_MAX_RETRIES: 10
  PACKAGE_NAME: ruff
  PYTHON_VERSION: "3.14"
  NEXTEST_PROFILE: ci
  MDTEST_EXTERNAL: "1"
jobs:
  parser-before:
    name: parser / before
    runs-on: github-ubuntu-24.04-x86_64-4
    if: ${{ inputs.phase == 'warm' && inputs.suite == 'parser' }}
    timeout-minutes: 20
    env:
      FORCE_COLOR: 1
      FUZZ_JOB_TIMEOUT_MINUTES: 20
    steps:
      - name: Record job start time
        run: echo "FUZZ_JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: 0.13.4
          checksum: 2b428396f12572d4429cf210ca234dd599a33b3af0958a4d5ed569d63e3f344f
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: ruff-linux-debug
          save-if: "false"
          prefix-key: ruff-simple-20261024-v1-before-linux
        name: Restore Rust cache
        id: rust-cache
      - name: Record Rust cache availability
        env:
          CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
          EXPECTED_HIT: "false"
        run: 'echo "Rust cache exact hit: ${CACHE_HIT:-false}"

          test "${CACHE_HIT:-false}" = "$EXPECTED_HIT"'
      - name: Install Rust toolchain
        run: rustup show
      - name: Build Ruff binary
        env:
          CARGO_PROFILE_DEV_DEBUG: line-tables-only
        run: cargo build --bin ruff
  parser-after:
    name: parser / after
    runs-on: github-ubuntu-24.04-x86_64-4
    if: ${{ inputs.phase == 'warm' && inputs.suite == 'parser' }}
    timeout-minutes: 20
    env:
      CARGO_UNSTABLE_CHECKSUM_FRESHNESS: "true"
      RUSTC_BOOTSTRAP: "1"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      FORCE_COLOR: 1
      FUZZ_JOB_TIMEOUT_MINUTES: 20
    steps:
      - name: Record job start time
        run: echo "FUZZ_JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: 0.13.4
          checksum: 2b428396f12572d4429cf210ca234dd599a33b3af0958a4d5ed569d63e3f344f
      - name: Install Rust toolchain
        run: rustup show
      - uses: astral-sh/github-actions/rust-workspace-cache@52ea66bbf7dbe95fc9e2baae530cb3827214c530
        with:
          key: ruff-binary-debug
          add-job-id-key: "false"
          save-if: "false"
          prefix-key: ruff-simple-parser-20261024-v1
        name: Restore Rust cache
        id: rust-cache
      - name: Record Rust cache availability
        env:
          CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
          EXPECTED_HIT: "true"
        run: 'echo "Rust cache exact hit: ${CACHE_HIT:-false}"

          test "${CACHE_HIT:-false}" = "$EXPECTED_HIT"'
      - name: Build Ruff binary
        run: cargo build --bin ruff
  seed-producer:
    name: producer-github / after
    runs-on: github-ubuntu-24.04-x86_64-4
    if: ${{ inputs.phase == 'seed' }}
    timeout-minutes: 20
    env:
      CARGO_UNSTABLE_CHECKSUM_FRESHNESS: "true"
      RUSTC_BOOTSTRAP: "1"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup show
      - uses: astral-sh/github-actions/rust-workspace-cache@52ea66bbf7dbe95fc9e2baae530cb3827214c530
        with:
          key: ruff-binary-debug
          add-job-id-key: "false"
          prefix-key: ruff-simple-parser-20261024-v1
          save-if: "true"
        name: Restore Rust cache
        id: rust-cache
      - name: Build Ruff binary
        run: cargo build --bin ruff
        if: ${{ steps.rust-cache.outputs.cache-hit != 'true' }}
  producer-after:
    name: producer-github / after
    runs-on: github-ubuntu-24.04-x86_64-4
    if: ${{ inputs.phase == 'warm' && inputs.suite == 'producer-github' }}
    timeout-minutes: 20
    env:
      CARGO_UNSTABLE_CHECKSUM_FRESHNESS: "true"
      RUSTC_BOOTSTRAP: "1"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup show
      - uses: astral-sh/github-actions/rust-workspace-cache@52ea66bbf7dbe95fc9e2baae530cb3827214c530
        with:
          key: ruff-binary-debug
          add-job-id-key: "false"
          prefix-key: ruff-simple-parser-20261024-v1
          save-if: "true"
        name: Restore Rust cache
        id: rust-cache
      - name: Record Rust cache availability
        env:
          CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
          EXPECTED_HIT: "true"
        run: 'echo "Rust cache exact hit: ${CACHE_HIT:-false}"

          test "${CACHE_HIT:-false}" = "$EXPECTED_HIT"'
      - name: Build Ruff binary
        run: cargo build --bin ruff
        if: ${{ steps.rust-cache.outputs.cache-hit != 'true' }}
  seed-producer-depot:
    name: producer / after
    runs-on: depot-ubuntu-24.04-8
    if: ${{ inputs.phase == 'seed' }}
    timeout-minutes: 20
    env:
      CARGO_UNSTABLE_CHECKSUM_FRESHNESS: "true"
      RUSTC_BOOTSTRAP: "1"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup show
      - uses: astral-sh/github-actions/rust-workspace-cache@52ea66bbf7dbe95fc9e2baae530cb3827214c530
        with:
          key: ruff-binary-debug
          add-job-id-key: "false"
          prefix-key: ruff-simple-parser-20261024-v1
          save-if: "true"
        name: Restore Rust cache
        id: rust-cache
      - name: Build Ruff binary
        run: cargo build --bin ruff
        if: ${{ steps.rust-cache.outputs.cache-hit != 'true' }}
  producer-after-depot:
    name: producer / after
    runs-on: depot-ubuntu-24.04-8
    if: ${{ inputs.phase == 'warm' && inputs.suite == 'producer' }}
    timeout-minutes: 20
    env:
      CARGO_UNSTABLE_CHECKSUM_FRESHNESS: "true"
      RUSTC_BOOTSTRAP: "1"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup show
      - uses: astral-sh/github-actions/rust-workspace-cache@52ea66bbf7dbe95fc9e2baae530cb3827214c530
        with:
          key: ruff-binary-debug
          add-job-id-key: "false"
          prefix-key: ruff-simple-parser-20261024-v1
          save-if: "true"
        name: Restore Rust cache
        id: rust-cache
      - name: Record Rust cache availability
        env:
          CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
          EXPECTED_HIT: "true"
        run: 'echo "Rust cache exact hit: ${CACHE_HIT:-false}"

          test "${CACHE_HIT:-false}" = "$EXPECTED_HIT"'
      - name: Build Ruff binary
        run: cargo build --bin ruff
        if: ${{ steps.rust-cache.outputs.cache-hit != 'true' }}
"on":
  workflow_dispatch:
    inputs:
      phase:
        type: choice
        options:
          - seed
          - warm
        default: warm
        required: true
      suite:
        type: choice
        options:
          - parser
          - producer
          - producer-github
        default: parser
        required: true
