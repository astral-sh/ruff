    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
      with:
        version: 0.13.4
        checksum: 2b428396f12572d4429cf210ca234dd599a33b3af0958a4d5ed569d63e3f344f
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      with:
        shared-key: ruff-linux-debug
        save-if: 'false'
        prefix-key: ruff-simple-20261024-v1-before-linux
      name: Restore Rust cache
      id: rust-cache
    - name: Record Rust cache availability
      env:
        CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
        EXPECTED_HIT: 'false'
      run: 'echo "Rust cache exact hit: ${CACHE_HIT:-false}"

        test "${CACHE_HIT:-false}" = "$EXPECTED_HIT"'
    - name: Install Rust toolchain
      run: rustup show
    - name: Build Ruff binary
      env:
        CARGO_PROFILE_DEV_DEBUG: line-tables-only
      run: cargo build --bin ruff
  seed-linux-after:
    name: linux / after
