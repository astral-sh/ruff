name: Measure Ruff benchmark and typing workspace caches
"on":
  workflow_dispatch:
    inputs:
      phase:
        type: choice
        options:
          - seed
          - warm
        default: warm
        required: true
      suite:
        type: choice
        options:
          - benchmark
          - typing
          - all
        default: all
        required: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  seed-benchmark-before:
    name: benchmark / before
    runs-on: depot-ubuntu-24.04
    if: ${{ inputs.phase == 'seed' && (inputs.suite == 'benchmark' || inputs.suite == 'all') }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout Branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          save-if: "true"
          prefix-key: ruff-simple-extra-20261024-v1-benchmark-before
          add-job-id-key: "false"
        name: Restore Rust cache
        id: rust-cache
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: 0.13.4
          checksum: 2b428396f12572d4429cf210ca234dd599a33b3af0958a4d5ed569d63e3f344f
      - name: Install Rust toolchain
        run: rustup show
      - name: Build benchmarks
        run:
          uv run --only-dev cargo codspeed build -m simulation -m memory --features "codspeed,ruff_instrumented" --profile
          profiling --no-default-features -p ruff_benchmark --bench formatter --bench lexer --bench linter --bench parser
    env:
      UV_LOCKED: 1
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      CARGO_PROFILE_DEV_LTO: "false"
      CARGO_PROFILE_DEV_OPT_LEVEL: 0
      CARGO_TERM_COLOR: always
      HAWK_VERSION: 0.1.15
      RUSTUP_MAX_RETRIES: 10
      PACKAGE_NAME: ruff
      PYTHON_VERSION: "3.14"
      NEXTEST_PROFILE: ci
      MDTEST_EXTERNAL: "1"
  warm-benchmark-before:
    name: benchmark / before
    runs-on: depot-ubuntu-24.04
    if: ${{ inputs.phase == 'warm' && (inputs.suite == 'benchmark' || inputs.suite == 'all') }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout Branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          save-if: "true"
          prefix-key: ruff-simple-extra-20261024-v1-benchmark-before
          add-job-id-key: "false"
        name: Restore Rust cache
        id: rust-cache
      - name: Record Rust cache availability
        env:
          CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
        run: 'echo "Rust cache exact hit: ${CACHE_HIT:-false}"

          test "${CACHE_HIT:-false}" = true'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: 0.13.4
          checksum: 2b428396f12572d4429cf210ca234dd599a33b3af0958a4d5ed569d63e3f344f
      - name: Install Rust toolchain
        run: rustup show
      - name: Build benchmarks
        run:
          uv run --only-dev cargo codspeed build -m simulation -m memory --features "codspeed,ruff_instrumented" --profile
          profiling --no-default-features -p ruff_benchmark --bench formatter --bench lexer --bench linter --bench parser
    env:
      UV_LOCKED: 1
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      CARGO_PROFILE_DEV_LTO: "false"
      CARGO_PROFILE_DEV_OPT_LEVEL: 0
      CARGO_TERM_COLOR: always
      HAWK_VERSION: 0.1.15
      RUSTUP_MAX_RETRIES: 10
      PACKAGE_NAME: ruff
      PYTHON_VERSION: "3.14"
      NEXTEST_PROFILE: ci
      MDTEST_EXTERNAL: "1"
  seed-benchmark-after:
    name: benchmark / after
    runs-on: depot-ubuntu-24.04
    if: ${{ inputs.phase == 'seed' && (inputs.suite == 'benchmark' || inputs.suite == 'all') }}
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      UV_LOCKED: 1
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      CARGO_PROFILE_DEV_LTO: "false"
      CARGO_PROFILE_DEV_OPT_LEVEL: 0
      CARGO_TERM_COLOR: always
      HAWK_VERSION: 0.1.15
      RUSTUP_MAX_RETRIES: 10
      PACKAGE_NAME: ruff
      PYTHON_VERSION: "3.14"
      NEXTEST_PROFILE: ci
      MDTEST_EXTERNAL: "1"
      CARGO_UNSTABLE_CHECKSUM_FRESHNESS: "true"
      RUSTC_BOOTSTRAP: "1"
    steps:
      - name: Checkout Branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup show
      - uses: astral-sh/github-actions/rust-workspace-cache@52ea66bbf7dbe95fc9e2baae530cb3827214c530
        with:
          profile: profiling
          save-if: "true"
          prefix-key: ruff-simple-extra-20261024-v1-benchmark-after
          add-job-id-key: "false"
        name: Restore Rust cache
        id: rust-cache
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: 0.13.4
          checksum: 2b428396f12572d4429cf210ca234dd599a33b3af0958a4d5ed569d63e3f344f
      - name: Build benchmarks
        run:
          uv run --only-dev cargo codspeed build -m simulation -m memory --features "codspeed,ruff_instrumented" --profile
          profiling --no-default-features -p ruff_benchmark --bench formatter --bench lexer --bench linter --bench parser
  warm-benchmark-after:
    name: benchmark / after
    runs-on: depot-ubuntu-24.04
    if: ${{ inputs.phase == 'warm' && (inputs.suite == 'benchmark' || inputs.suite == 'all') }}
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      UV_LOCKED: 1
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      CARGO_PROFILE_DEV_LTO: "false"
      CARGO_PROFILE_DEV_OPT_LEVEL: 0
      CARGO_TERM_COLOR: always
      HAWK_VERSION: 0.1.15
      RUSTUP_MAX_RETRIES: 10
      PACKAGE_NAME: ruff
      PYTHON_VERSION: "3.14"
      NEXTEST_PROFILE: ci
      MDTEST_EXTERNAL: "1"
      CARGO_UNSTABLE_CHECKSUM_FRESHNESS: "true"
      RUSTC_BOOTSTRAP: "1"
    steps:
      - name: Checkout Branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup show
      - uses: astral-sh/github-actions/rust-workspace-cache@52ea66bbf7dbe95fc9e2baae530cb3827214c530
        with:
