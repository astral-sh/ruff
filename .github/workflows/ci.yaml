      PACKAGE_NAME: ruff
      PYTHON_VERSION: '3.14'
      NEXTEST_PROFILE: ci
      MDTEST_EXTERNAL: '1'
      CARGO_UNSTABLE_CHECKSUM_FRESHNESS: 'true'
      RUSTC_BOOTSTRAP: '1'
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.phase == 'seed' && 'acba99d527b8a9fd2e15490df42d0e6d744a4331' || '7a8f63f0d71a1d381f99652a5fee3b043b32e8e6'
          }}
        persist-credentials: false
    - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        activate-environment: true
