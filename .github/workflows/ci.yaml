          cargo build --bin ty --profile profiling
          mv target/profiling/ty ty-new

          # The first parent contains any preceding layers in a stacked pull request.
          MERGE_BASE="$(git rev-parse "${GITHUB_SHA}^1")"
          git checkout -b old_commit "$MERGE_BASE"
          echo "old commit (merge base)"
          git rev-list --format=%s --max-count=1 old_commit
          cargo build --bin ty --profile profiling
          mv target/profiling/ty ty-old
        )
  build-ty:
    name: Build ty (${{ matrix.revision }})
    strategy:
      matrix:
        revision:
        - base
        - pr
    runs-on: ${{ github.repository == 'astral-sh/ruff' && 'github-ubuntu-24.04-x86_64-32' || 'ubuntu-latest' }}
    timeout-minutes: 5
    if: ${{ inputs.case == 'build-ty' }}
    permissions:
      contents: read
    env:
      UV_LOCKED: 1
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      CARGO_TERM_COLOR: always
      RUSTUP_MAX_RETRIES: 10
      RUST_BACKTRACE: 1
      CARGO_PROFILE_PROFILING_DEBUG: line-tables-only
      CARGO_UNSTABLE_CHECKSUM_FRESHNESS: 'true'
      RUSTC_BOOTSTRAP: '1'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{ github.sha }}
    - name: Fetch full history without tags
      if: matrix.revision == 'base'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh auth setup-git
        git fetch --no-tags --filter=blob:none --unshallow origin
    - name: Install Rust toolchain
      run: rustup show
    - uses: astral-sh/github-actions/rust-workspace-cache@3c9fe5db47e144ea224b57565e3ab1ab769ef41d
      with:
        profile: profiling
        save-if: 'false'
        prefix-key: ruff-ws-measure-20261022-after
    - name: Install mold
      uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444
    - name: Build ty
      env:
        REVISION: ${{ matrix.revision }}
      run: |
        if [[ "${REVISION}" == "base" ]]; then
          # The first parent contains any preceding layers in a stacked pull request.
          MERGE_BASE="$(git rev-parse "${GITHUB_SHA}^1")"
          echo "${MERGE_BASE}" > merge-base.txt
          echo "Merge base: ${MERGE_BASE}"
          echo "PR commit: ${GITHUB_SHA}"

          git checkout "${MERGE_BASE}"
        fi

        echo "Building ${REVISION} revision $(git rev-parse HEAD)"
        cargo build --package ty --profile profiling
        cp target/profiling/ty "ty-${REVISION}"

        if [[ "${REVISION}" == "pr" ]]; then
          cp crates/ty_python_semantic/resources/primer/flaky.txt projects_flaky.txt
          cp .github/ty-ecosystem.toml ty-ecosystem.toml
          cp .github/ty-ecosystem-constraints.txt ty-ecosystem-constraints.txt
        fi
    - name: Upload base ty binary
      if: matrix.revision == 'base'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ty-build-base
        compression-level: 1
        path: |
          ty-base
          merge-base.txt
    - name: Upload PR ty binary, flaky project list, config, and constraints
      if: matrix.revision == 'pr'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ty-build-pr
        compression-level: 1
        path: |
          ty-pr
          projects_flaky.txt
          ty-ecosystem.toml
          ty-ecosystem-constraints.txt
    - name: Upload ecosystem-analyzer dependency metadata
      if: matrix.revision == 'pr'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ty-build-dependencies
        path: |
          pyproject.toml
          uv.lock
  ty-ecosystem-report:
    name: Create ecosystem report
    runs-on: ${{ github.repository == 'astral-sh/ruff' && 'github-ubuntu-24.04-x86_64-32' || 'ubuntu-latest' }}
    timeout-minutes: 40
    if: ${{ inputs.case == 'ty-ecosystem-report' }}
    permissions:
      contents: read
    env:
      UV_LOCKED: 1
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      CARGO_TERM_COLOR: always
      RUSTUP_MAX_RETRIES: 10
      RUST_BACKTRACE: 1
      CARGO_PROFILE_PROFILING_DEBUG: line-tables-only
      CARGO_UNSTABLE_CHECKSUM_FRESHNESS: 'true'
      RUSTC_BOOTSTRAP: '1'
      TY_UV: scripts
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Fetch full history without tags
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh auth setup-git
        git fetch --no-tags --filter=blob:none --unshallow origin
    - name: Install the latest version of uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
      with:
        enable-cache: true
        save-cache: false
        version: 0.13.4
        checksum: 2b428396f12572d4429cf210ca234dd599a33b3af0958a4d5ed569d63e3f344f
    - name: Install Rust toolchain
      run: rustup show
    - uses: astral-sh/github-actions/rust-workspace-cache@3c9fe5db47e144ea224b57565e3ab1ab769ef41d
      with:
        profile: profiling
        save-if: 'false'
        prefix-key: ruff-ws-measure-20261022-after
    - name: Install mold
      uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444
    - name: Build ty
      shell: bash
      env:
        UV_CONSTRAINT: ${{ github.workspace }}/.github/ty-ecosystem-constraints.txt
      run: |
        cargo build --package ty --profile profiling
