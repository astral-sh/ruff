name: Inspect restored Windows Rust caches
run-name: Inspect Windows cache contents
'on':
  workflow_dispatch:
    inputs:
      phase:
        type: choice
        options:
        - seed
        - warm
        default: warm
        required: true
      suite:
        type: string
        default: all
        required: true
      schema-changed:
        type: string
        default: 'false'
        required: false
permissions:
  contents: read
jobs:
  windows-before:
    name: windows / before
    runs-on: namespace-profile-windows-2022-x86-64-16x32
    if: ${{ (inputs.suite == 'all' || inputs.suite == 'windows') }}
    timeout-minutes: 20
    env:
      UV_LOCKED: 1
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      CARGO_PROFILE_DEV_LTO: 'false'
      CARGO_PROFILE_DEV_OPT_LEVEL: 0
      CARGO_TERM_COLOR: always
      HAWK_VERSION: 0.1.15
      RUSTUP_MAX_RETRIES: 10
      PACKAGE_NAME: ruff
      PYTHON_VERSION: '3.14'
      NEXTEST_PROFILE: ci
      MDTEST_EXTERNAL: '1'
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: 7a8f63f0d71a1d381f99652a5fee3b043b32e8e6
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      with:
        save-if: ${{ inputs.phase == 'seed' }}
        cache-bin: 'false'
        prefix-key: ruff-deps-20261024-v1-windows-before
      name: Restore Rust cache
      id: rust-cache
    - name: Record Rust cache availability
      if: ${{ inputs.phase == 'warm' }}
      shell: bash
      env:
        CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
        EXPECTED_HIT: 'true'
      run: 'echo "Rust cache exact hit: ${CACHE_HIT:-false}"

        test "${CACHE_HIT:-false}" = "$EXPECTED_HIT"'
    - name: Install Rust toolchain
      run: rustup show
    - name: Install uv (Windows)
      if: runner.os == 'Windows'
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
      with:
        version: 0.13.4
        checksum: ccec7508a07d9933d7cb1261880633efcf1f30d6e6eddab21823f1dae6f23225
        enable-cache: 'true'
        cache-python: true
    - name: Install uv (macOS)
      if: runner.os == 'macOS'
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
      with:
        version: 0.13.4
        checksum: e0b1d4743ce64c55d9f0f4a444afa6b81125680070ee04e853fcd0f6c1ebf8f1
        enable-cache: 'true'
        cache-python: true
    - name: Inspect restored cache contents
      run: "uv run --no-project --no-config python - <<'PY'\nimport json,os\nfrom collections import defaultdict\nfrom pathlib\
        \ import Path\ncargo=Path(os.environ.get('CARGO_HOME',Path.home()/'.cargo'))\nroots={'target':Path('target'),'cargo-registry':cargo/'registry','cargo-git':cargo/'git'}\n\
        for path in Path(os.environ['RUNNER_TEMP']).glob('rust-cache-binaries-*'):\n    roots['staged-binaries']=path\nfor\
        \ label,root in roots.items():\n    groups=defaultdict(lambda:[0,0]);files=[]\n    if not root.exists():continue\n\
        \    for path in root.rglob('*'):\n        if not path.is_file() or path.is_symlink():continue\n        size=path.stat().st_size;rel=path.relative_to(root)\n\
        \        key='/'.join(rel.parts[:2] if label=='target' else rel.parts[:1])\n        groups[key][0]+=1;groups[key][1]+=size\n\
        \        files.append((size,str(rel)))\n    print('CACHE_INVENTORY '+json.dumps({'root':label,'groups':dict(groups),'largest':sorted(files,reverse=True)[:30]}))\n\
        PY\n"
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
  windows-after:
    name: windows / after
    runs-on: namespace-profile-windows-2022-x86-64-16x32
    if: ${{ (inputs.suite == 'all' || inputs.suite == 'windows') }}
    timeout-minutes: 20
    env:
      UV_LOCKED: 1
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      CARGO_PROFILE_DEV_LTO: 'false'
      CARGO_PROFILE_DEV_OPT_LEVEL: 0
      CARGO_TERM_COLOR: always
      HAWK_VERSION: 0.1.15
      RUSTUP_MAX_RETRIES: 10
      PACKAGE_NAME: ruff
      PYTHON_VERSION: '3.14'
      NEXTEST_PROFILE: ci
      MDTEST_EXTERNAL: '1'
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: 7a8f63f0d71a1d381f99652a5fee3b043b32e8e6
    - uses: astral-sh/github-actions/rust-workspace-cache@ebba56fe7c986140673e8fa55355eae44fa0b4a0
      with:
        cache-workspace-crates: 'false'
        save-if: ${{ inputs.phase == 'seed' }}
        prefix-key: ruff-deps-20261024-v1-windows-after
      name: Restore Rust cache
      id: rust-cache
    - name: Record Rust cache availability
      if: ${{ inputs.phase == 'warm' }}
      shell: bash
      env:
        CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
        EXPECTED_HIT: 'true'
      run: 'echo "Rust cache exact hit: ${CACHE_HIT:-false}"

        test "${CACHE_HIT:-false}" = "$EXPECTED_HIT"'
    - name: Install Rust toolchain
      run: rustup show
    - name: Install uv (Windows)
      if: runner.os == 'Windows'
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
      with:
        version: 0.13.5
        checksum: a38b8d1902b7cfbc76b423ba1bb456f623f42064cdc72628b6075b89afd1019a
        enable-cache: 'true'
        cache-python: true
    - name: Install uv (macOS)
      if: runner.os == 'macOS'
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
      with:
        version: 0.13.5
        checksum: 743f85035a1996ecb350659e01cd9faea9709829be09b1b4b03c73eaf3c9cd73
        enable-cache: 'true'
        cache-python: true
    - name: Inspect restored cache contents
      run: "uv run --no-project --no-config python - <<'PY'\nimport json,os\nfrom collections import defaultdict\nfrom pathlib\
        \ import Path\ncargo=Path(os.environ.get('CARGO_HOME',Path.home()/'.cargo'))\nroots={'target':Path('target'),'cargo-registry':cargo/'registry','cargo-git':cargo/'git'}\n\
        for path in Path(os.environ['RUNNER_TEMP']).glob('rust-cache-binaries-*'):\n    roots['staged-binaries']=path\nfor\
        \ label,root in roots.items():\n    groups=defaultdict(lambda:[0,0]);files=[]\n    if not root.exists():continue\n\
        \    for path in root.rglob('*'):\n        if not path.is_file() or path.is_symlink():continue\n        size=path.stat().st_size;rel=path.relative_to(root)\n\
        \        key='/'.join(rel.parts[:2] if label=='target' else rel.parts[:1])\n        groups[key][0]+=1;groups[key][1]+=size\n\
        \        files.append((size,str(rel)))\n    print('CACHE_INVENTORY '+json.dumps({'root':label,'groups':dict(groups),'largest':sorted(files,reverse=True)[:30]}))\n\
        PY\n"
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
