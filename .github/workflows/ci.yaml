  linux-before:
    name: linux / before
    runs-on: ${{ github.repository == 'astral-sh/ruff' && 'depot-ubuntu-22.04-16' || 'ubuntu-latest' }}
    if: ${{ (inputs.suite == 'all' || inputs.suite == 'linux') }}
    timeout-minutes: 20
    env:
      UV_LOCKED: 1
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      CARGO_PROFILE_DEV_LTO: 'false'
      CARGO_PROFILE_DEV_OPT_LEVEL: 0
      CARGO_TERM_COLOR: always
      HAWK_VERSION: 0.1.15
      RUSTUP_MAX_RETRIES: 10
      PACKAGE_NAME: ruff
      PYTHON_VERSION: '3.14'
      NEXTEST_PROFILE: ci
      MDTEST_EXTERNAL: '1'
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{ inputs.phase == 'seed' && 'acba99d527b8a9fd2e15490df42d0e6d744a4331' || '7a8f63f0d71a1d381f99652a5fee3b043b32e8e6'
          }}
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      with:
        shared-key: ruff-linux-debug
        save-if: ${{ inputs.phase == 'seed' }}
        prefix-key: ruff-aged-shared-20261024-v1-linux-before
      name: Restore Rust cache
      id: rust-cache
    - name: Record Rust cache availability
      if: ${{ inputs.phase == 'warm' }}
      shell: bash
      env:
        CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
        EXPECTED_HIT: 'true'
      run: |-
        echo "Rust cache exact hit: ${CACHE_HIT:-false}"
        test "${CACHE_HIT:-false}" = "$EXPECTED_HIT"
    - name: Install Rust toolchain
      run: rustup show
    - name: Install uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
      with:
        version: 0.13.5
        checksum: f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f
        enable-cache: 'true'
        cache-python: true
    - name: ty mdtests (GitHub annotations)
      if: ${{ inputs.phase == 'warm' }}
      env:
        NO_COLOR: 1
        MDTEST_GITHUB_ANNOTATIONS_FORMAT: 1
      run: cargo test -p ty_python_semantic --test mdtest || true
    - name: Run tests
      run: uv run --locked --only-dev cargo insta test --all-features --unreferenced reject --test-runner nextest --disable-nextest-doctest
    - name: Run doctests
      run: cargo test --doc --all-features
    - name: Check parser without stacker
      run: cargo check --locked -p ruff_python_parser --no-default-features --all-targets
    - name: Dogfood ty on py-fuzzer
      run: uv run --quiet --python="${PYTHON_VERSION}" --project=./python/py-fuzzer cargo run --quiet -p ty check --project=./python/py-fuzzer
        --color=always
    - name: Dogfood ty on ty_benchmark
      run: uv run --quiet --project=./scripts/ty_benchmark cargo run --quiet -p ty check --project=./scripts/ty_benchmark
        --color=always
    - name: Dogfood ty on scripts
      env:
        TY_UV: scripts
        UV_LOCKED: 'true'
        UV_PYTHON: ${{ env.PYTHON_VERSION }}
      run: |
        uv run --locked scripts/check-scripts.py --write-ty-args-file "$RUNNER_TEMP/script-paths.txt"
        cargo run --quiet -p ty check "@$RUNNER_TEMP/script-paths.txt" --color=always
    - run: cargo doc --all --no-deps
      env:
        RUSTDOCFLAGS: -D warnings
    - run: cargo doc --no-deps -p ty_python_semantic -p ty_python_core -p ty_module_resolver -p ty_site_packages -p ty_combine
        -p ty_project -p ty_ide -p ty_wasm -p ty_vendored -p ty_static -p ty -p ty_test -p ruff_db -p ruff_python_formatter
        --document-private-items
      env:
        RUSTDOCFLAGS: -D warnings
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
