        run:
          "git apply <<'MDTEST_PATCH'\ndiff --git a/.config/nextest.toml b/.config/nextest.toml\nindex f2537ce58..c959b1153\
          \ 100644\n--- a/.config/nextest.toml\n+++ b/.config/nextest.toml\n@@ -22,3 +22,11 @@ slow-timeout =  { period = \"\
          1s\", terminate-after = 60 }\n \n # Show slow jobs in the final summary\n final-status-level = \"slow\"\n+\n+[profile.ci-annotations]\n\
          +inherits = \"ci\"\n+\n+[[profile.ci-annotations.overrides]]\n+filter = 'binary(mdtest)'\n+# Emit each GitHub annotation\
          \ once.\n+failure-output = \"immediate\"\ndiff --git a/crates/mdtest/src/lib.rs b/crates/mdtest/src/lib.rs\nindex\
          \ bfc0ba057..f323f9c5e 100644\n--- a/crates/mdtest/src/lib.rs\n+++ b/crates/mdtest/src/lib.rs\n@@ -25,9 +25,9 @@ const\
          \ MDTEST_TEST_FILTER: &str = \"MDTEST_TEST_FILTER\";\n /// If set to a value other than \"0\", updates the content\
          \ of inline snapshots.\n const MDTEST_UPDATE_SNAPSHOTS: &str = \"MDTEST_UPDATE_SNAPSHOTS\";\n \n-/// Switch mdtest\
          \ output format to GitHub Actions annotations.\n+/// Add GitHub Actions annotations to mdtest failure output.\n ///\n\
          -/// If set (to any value), mdtest will output errors in GitHub Actions format.\n+/// If set (to any value), mdtest\
          \ also emits errors as GitHub Actions workflow commands.\n const MDTEST_GITHUB_ANNOTATIONS_FORMAT: &str = \"MDTEST_GITHUB_ANNOTATIONS_FORMAT\"\
          ;\n \n mod assertion;\n@@ -80,7 +80,7 @@ pub fn run<C>(\n         let this_test_failed = result.is_err();\n      \
          \   any_failures = any_failures || this_test_failed;\n \n-        if this_test_failed && output_format.is_cli() {\n\
          +        if this_test_failed {\n             let _ = writeln!(assertion, \"\\n\\n{}\\n\", test.name().bold().underline());\n\
          \         }\n \n@@ -128,7 +128,7 @@ pub fn run<C>(\n             }\n         }\n \n-        if this_test_failed &&\
          \ output_format.is_cli() {\n+        if this_test_failed {\n             assertion.push_str(&test_assertion);\n \n\
          \             let escaped_test_name = test.name().replace('\\'', \"\\\\'\");\n@@ -170,25 +170,17 @@ fn output_format()\
          \ -> OutputFormat {\n pub enum OutputFormat {\n     /// The format `cargo test` should use by default.\n     Cli,\n\
          -    /// A format that will provide annotations from GitHub Actions\n-    /// if mdtest fails on a PR.\n+    /// CLI\
