name: Workspace cache measurements
run-name: after / ${{ inputs.case }}
'on':
  workflow_dispatch:
    inputs:
      case:
        description: Production job to measure
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: ruff-workspace-cache-${{ github.ref }}-${{ inputs.case }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  cargo-clippy:
    name: cargo clippy
    runs-on: ${{ github.repository == 'astral-sh/ruff' && 'github-ubuntu-24.04-x86_64-4' || 'ubuntu-latest' }}
    if: ${{ inputs.case == 'cargo-clippy' }}
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      UV_LOCKED: 1
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      CARGO_PROFILE_DEV_LTO: 'false'
      CARGO_PROFILE_DEV_OPT_LEVEL: 0
      CARGO_TERM_COLOR: always
      HAWK_VERSION: 0.1.15
      RUSTUP_MAX_RETRIES: 10
      PACKAGE_NAME: ruff
      PYTHON_VERSION: '3.14'
      NEXTEST_PROFILE: ci
      MDTEST_EXTERNAL: '1'
      CARGO_UNSTABLE_CHECKSUM_FRESHNESS: 'true'
      RUSTC_BOOTSTRAP: '1'
      CARGO_BUILD_WARNINGS: deny
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Install Rust toolchain
      run: |
        rustup component add clippy
        rustup target add wasm32-unknown-unknown
    - uses: astral-sh/github-actions/rust-workspace-cache@3c9fe5db47e144ea224b57565e3ab1ab769ef41d
      with:
        profile: |
          debug
          wasm32-unknown-unknown/debug
        save-if: 'true'
        prefix-key: ruff-ws-measure-20261022-after
    - name: Clippy
      run: cargo clippy --workspace --all-targets --all-features --locked
    - name: Clippy (wasm)
      run: cargo clippy -p ruff_wasm -p ty_wasm --target wasm32-unknown-unknown --all-features --locked
  cargo-test-linux:
    name: cargo test (linux)
    runs-on: ${{ github.repository == 'astral-sh/ruff' && 'depot-ubuntu-22.04-16' || 'ubuntu-latest' }}
    if: ${{ inputs.case == 'cargo-test-linux' }}
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      UV_LOCKED: 1
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      CARGO_PROFILE_DEV_LTO: 'false'
      CARGO_PROFILE_DEV_OPT_LEVEL: 0
      CARGO_TERM_COLOR: always
      HAWK_VERSION: 0.1.15
      RUSTUP_MAX_RETRIES: 10
      PACKAGE_NAME: ruff
      PYTHON_VERSION: '3.14'
      NEXTEST_PROFILE: ci
      MDTEST_EXTERNAL: '1'
      CARGO_UNSTABLE_CHECKSUM_FRESHNESS: 'true'
      RUSTC_BOOTSTRAP: '1'
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Install Rust toolchain
      run: rustup show
    - uses: astral-sh/github-actions/rust-workspace-cache@3c9fe5db47e144ea224b57565e3ab1ab769ef41d
      with:
        key: ruff-linux-debug
        add-job-id-key: 'false'
        save-if: 'true'
        prefix-key: ruff-ws-measure-20261022-after
    - name: Install mold
      uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444
    - name: Install uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
      with:
        version: 0.13.4
        checksum: 2b428396f12572d4429cf210ca234dd599a33b3af0958a4d5ed569d63e3f344f
        enable-cache: 'true'
        cache-python: true
    - name: ty mdtests (GitHub annotations)
      env:
        NO_COLOR: 1
        MDTEST_GITHUB_ANNOTATIONS_FORMAT: 1
      run: cargo test -p ty_python_semantic --test mdtest || true
    - name: Run tests
      run: uv run --locked --only-dev cargo insta test --all-features --unreferenced reject --test-runner nextest --disable-nextest-doctest
    - name: Run doctests
      run: cargo test --doc --all-features
    - name: Check parser without stacker
      run: cargo check --locked -p ruff_python_parser --no-default-features --all-targets
    - name: Dogfood ty on py-fuzzer
      run: uv run --quiet --python="${PYTHON_VERSION}" --project=./python/py-fuzzer cargo run --quiet -p ty check --project=./python/py-fuzzer
        --color=always
    - name: Dogfood ty on ty_benchmark
      run: uv run --quiet --project=./scripts/ty_benchmark cargo run --quiet -p ty check --project=./scripts/ty_benchmark
        --color=always
    - name: Dogfood ty on scripts
      env:
        TY_UV: scripts
        UV_LOCKED: 'true'
        UV_PYTHON: ${{ env.PYTHON_VERSION }}
      run: |
        uv run --locked scripts/check-scripts.py --write-ty-args-file "$RUNNER_TEMP/script-paths.txt"
        cargo run --quiet -p ty check "@$RUNNER_TEMP/script-paths.txt" --color=always
    - run: cargo doc --all --no-deps
      env:
        RUSTDOCFLAGS: -D warnings
    - run: cargo doc --no-deps -p ty_python_semantic -p ty_python_core -p ty_module_resolver -p ty_site_packages -p ty_combine
        -p ty_project -p ty_ide -p ty_wasm -p ty_vendored -p ty_static -p ty -p ty_test -p ruff_db -p ruff_python_formatter
        --document-private-items
      env:
        RUSTDOCFLAGS: -D warnings
  cargo-test-linux-release:
    name: cargo test (linux, release)
    runs-on: depot-ubuntu-22.04-16
    if: ${{ inputs.case == 'cargo-test-linux-release' }}
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      UV_LOCKED: 1
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      CARGO_PROFILE_DEV_LTO: 'false'
      CARGO_PROFILE_DEV_OPT_LEVEL: 0
      CARGO_TERM_COLOR: always
      HAWK_VERSION: 0.1.15
      RUSTUP_MAX_RETRIES: 10
      PACKAGE_NAME: ruff
      PYTHON_VERSION: '3.14'
      NEXTEST_PROFILE: ci
      MDTEST_EXTERNAL: '1'
      CARGO_UNSTABLE_CHECKSUM_FRESHNESS: 'true'
      RUSTC_BOOTSTRAP: '1'
      CARGO_PROFILE_PROFILING_DEBUG: line-tables-only
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Install Rust toolchain
      run: rustup show
    - uses: astral-sh/github-actions/rust-workspace-cache@3c9fe5db47e144ea224b57565e3ab1ab769ef41d
      with:
        profile: profiling
        save-if: 'true'
        prefix-key: ruff-ws-measure-20261022-after
    - name: Install mold
      uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444
    - name: Install uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
      with:
        version: 0.13.4
        checksum: 2b428396f12572d4429cf210ca234dd599a33b3af0958a4d5ed569d63e3f344f
        enable-cache: 'true'
        cache-python: true
    - name: Run tests
      run: uv run --locked --only-dev cargo nextest run --cargo-profile profiling --all-features
    - name: Run doctests
      run: cargo test --doc --profile profiling --all-features
  cargo-test-other:
    strategy:
      fail-fast: false
      matrix:
        platform:
        - ${{ github.repository == 'astral-sh/ruff' && 'namespace-profile-windows-2022-x86-64-16x32' || 'windows-latest' }}
        - ${{ github.repository == 'astral-sh/ruff' && 'namespace-profile-macos-15' || 'macos-latest' }}
    name: cargo test (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    if: ${{ inputs.case == 'cargo-test-other' }}
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      UV_LOCKED: 1
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      CARGO_PROFILE_DEV_LTO: 'false'
      CARGO_PROFILE_DEV_OPT_LEVEL: 0
      CARGO_TERM_COLOR: always
      HAWK_VERSION: 0.1.15
      RUSTUP_MAX_RETRIES: 10
      PACKAGE_NAME: ruff
      PYTHON_VERSION: '3.14'
      NEXTEST_PROFILE: ci
      MDTEST_EXTERNAL: '1'
      CARGO_UNSTABLE_CHECKSUM_FRESHNESS: 'true'
      RUSTC_BOOTSTRAP: '1'
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Install Rust toolchain
      run: rustup show
    - uses: astral-sh/github-actions/rust-workspace-cache@3c9fe5db47e144ea224b57565e3ab1ab769ef41d
      with:
        save-if: 'true'
        cache-bin: 'false'
        prefix-key: ruff-ws-measure-20261022-after
    - name: Install uv (Windows)
      if: runner.os == 'Windows'
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
      with:
        version: 0.13.4
        checksum: ccec7508a07d9933d7cb1261880633efcf1f30d6e6eddab21823f1dae6f23225
        enable-cache: 'true'
        cache-python: true
    - name: Install uv (macOS)
      if: runner.os == 'macOS'
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
      with:
        version: 0.13.4
        checksum: e0b1d4743ce64c55d9f0f4a444afa6b81125680070ee04e853fcd0f6c1ebf8f1
        enable-cache: 'true'
        cache-python: true
    - name: Run tests
      run: |
        uv run --locked --only-dev cargo nextest run --all-features --profile ci
        cargo test --all-features --doc
  cargo-test-wasm:
    name: cargo test (wasm)
    runs-on: ${{ github.repository == 'astral-sh/ruff' && 'github-ubuntu-24.04-x86_64-4' || 'ubuntu-latest' }}
    if: ${{ inputs.case == 'cargo-test-wasm' }}
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      UV_LOCKED: 1
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      CARGO_PROFILE_DEV_LTO: 'false'
      CARGO_PROFILE_DEV_OPT_LEVEL: 0
      CARGO_TERM_COLOR: always
      HAWK_VERSION: 0.1.15
      RUSTUP_MAX_RETRIES: 10
      PACKAGE_NAME: ruff
      PYTHON_VERSION: '3.14'
      NEXTEST_PROFILE: ci
      MDTEST_EXTERNAL: '1'
      CARGO_UNSTABLE_CHECKSUM_FRESHNESS: 'true'
      RUSTC_BOOTSTRAP: '1'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Install Rust toolchain
      run: rustup target add wasm32-unknown-unknown
    - uses: astral-sh/github-actions/rust-workspace-cache@3c9fe5db47e144ea224b57565e3ab1ab769ef41d
      with:
        profile: |
          debug
          wasm32-unknown-unknown/debug
        save-if: 'true'
        prefix-key: ruff-ws-measure-20261022-after
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: 24.21.0
        cache: npm
        cache-dependency-path: playground/package-lock.json
    - uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa
      with:
        version: v0.13.1
    - name: Test ruff_wasm
      run: |
        cd crates/ruff_wasm
        wasm-pack test --node
    - name: Test ty_wasm
      run: |
        cd crates/ty_wasm
        wasm-pack test --node
  cargo-fuzz-build:
    name: cargo fuzz build
    runs-on: ${{ github.repository == 'astral-sh/ruff' && 'github-ubuntu-24.04-x86_64-4' || 'ubuntu-latest' }}
    if: ${{ inputs.case == 'cargo-fuzz-build' }}
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      UV_LOCKED: 1
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      CARGO_PROFILE_DEV_LTO: 'false'
      CARGO_PROFILE_DEV_OPT_LEVEL: 0
      CARGO_TERM_COLOR: always
      HAWK_VERSION: 0.1.15
      RUSTUP_MAX_RETRIES: 10
      PACKAGE_NAME: ruff
      PYTHON_VERSION: '3.14'
      NEXTEST_PROFILE: ci
      MDTEST_EXTERNAL: '1'
      CARGO_UNSTABLE_CHECKSUM_FRESHNESS: 'true'
      RUSTC_BOOTSTRAP: '1'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Install Rust toolchain
      run: rustup show
    - uses: astral-sh/github-actions/rust-workspace-cache@3c9fe5db47e144ea224b57565e3ab1ab769ef41d
      with:
        profile: |
          release
          x86_64-unknown-linux-gnu/release
        workspace: fuzz
        save-if: 'true'
        prefix-key: ruff-ws-measure-20261022-after
    - name: Install mold
      uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444
    - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
      with:
        version: 0.13.4
        checksum: 2b428396f12572d4429cf210ca234dd599a33b3af0958a4d5ed569d63e3f344f
    - run: uv run --only-dev cargo fuzz build -s none
  fuzz-parser:
    name: fuzz parser
    runs-on: ${{ github.repository == 'astral-sh/ruff' && 'github-ubuntu-24.04-x86_64-4' || 'ubuntu-latest' }}
    if: ${{ inputs.case == 'fuzz-parser' }}
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      UV_LOCKED: 1
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      CARGO_PROFILE_DEV_LTO: 'false'
      CARGO_PROFILE_DEV_OPT_LEVEL: 0
      CARGO_TERM_COLOR: always
      HAWK_VERSION: 0.1.15
      RUSTUP_MAX_RETRIES: 10
      PACKAGE_NAME: ruff
      PYTHON_VERSION: '3.14'
      NEXTEST_PROFILE: ci
      MDTEST_EXTERNAL: '1'
      CARGO_UNSTABLE_CHECKSUM_FRESHNESS: 'true'
      RUSTC_BOOTSTRAP: '1'
      FORCE_COLOR: 1
      FUZZ_JOB_TIMEOUT_MINUTES: 20
    steps:
    - name: Record job start time
      run: echo "FUZZ_JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
      with:
        version: 0.13.4
        checksum: 2b428396f12572d4429cf210ca234dd599a33b3af0958a4d5ed569d63e3f344f
    - name: Install Rust toolchain
      run: rustup show
    - uses: astral-sh/github-actions/rust-workspace-cache@3c9fe5db47e144ea224b57565e3ab1ab769ef41d
      with:
        key: ruff-linux-debug
        add-job-id-key: 'false'
        save-if: 'false'
        prefix-key: ruff-ws-measure-20261022-after
    - name: Install mold
      uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444
    - name: Build Ruff binary
      env:
        CARGO_PROFILE_DEV_DEBUG: line-tables-only
      run: cargo build --bin ruff
  scripts:
    name: test scripts
    runs-on: ${{ github.repository == 'astral-sh/ruff' && 'github-ubuntu-24.04-x86_64-4' || 'ubuntu-latest' }}
    if: ${{ inputs.case == 'scripts' }}
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      UV_LOCKED: 1
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      CARGO_PROFILE_DEV_LTO: 'false'
      CARGO_PROFILE_DEV_OPT_LEVEL: 0
      CARGO_TERM_COLOR: always
      HAWK_VERSION: 0.1.15
      RUSTUP_MAX_RETRIES: 10
      PACKAGE_NAME: ruff
      PYTHON_VERSION: '3.14'
      NEXTEST_PROFILE: ci
      MDTEST_EXTERNAL: '1'
      CARGO_UNSTABLE_CHECKSUM_FRESHNESS: 'true'
      RUSTC_BOOTSTRAP: '1'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Install Rust toolchain
      run: rustup component add rustfmt
    - uses: astral-sh/github-actions/rust-workspace-cache@3c9fe5db47e144ea224b57565e3ab1ab769ef41d
      with:
        save-if: 'true'
        prefix-key: ruff-ws-measure-20261022-after
    - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
      with:
        version: 0.13.4
        checksum: 2b428396f12572d4429cf210ca234dd599a33b3af0958a4d5ed569d63e3f344f
    - run: python crates/ruff_python_ast/generate.py
    - run: python crates/ruff_python_formatter/generate.py
    - run: test -z "$(git status --porcelain)"
    - run: ./scripts/add_rule.py --name DoTheThing --prefix F --code 999 --linter pyflakes --category correctness
    - run: cargo check
    - run: |
        ./scripts/add_plugin.py test --url https://pypi.org/project/-test/0.1.0/ --prefix TST
        ./scripts/add_rule.py --name FirstRule --prefix TST --code 001 --linter test --category correctness
    - run: cargo check
    - run: uv run --python="${PYTHON_VERSION}" --directory=./python/py-fuzzer mypy
    - run: uv run --python="${PYTHON_VERSION}" --directory=./python/py-fuzzer ruff format --check
    - run: uv run --python="${PYTHON_VERSION}" --directory=./python/py-fuzzer ruff check
  ecosystem:
    name: ecosystem
    runs-on: ${{ github.repository == 'astral-sh/ruff' && 'depot-ubuntu-24.04-8' || 'ubuntu-latest' }}
    if: ${{ inputs.case == 'ecosystem' }}
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      UV_LOCKED: 1
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      CARGO_PROFILE_DEV_LTO: 'false'
      CARGO_PROFILE_DEV_OPT_LEVEL: 0
      CARGO_TERM_COLOR: always
      HAWK_VERSION: 0.1.15
      RUSTUP_MAX_RETRIES: 10
      PACKAGE_NAME: ruff
      PYTHON_VERSION: '3.14'
      NEXTEST_PROFILE: ci
      MDTEST_EXTERNAL: '1'
      CARGO_UNSTABLE_CHECKSUM_FRESHNESS: 'true'
      RUSTC_BOOTSTRAP: '1'
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: 7a8f63f0d71a1d381f99652a5fee3b043b32e8e6
        persist-credentials: false
    - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        activate-environment: true
        version: 0.13.4
        checksum: 2b428396f12572d4429cf210ca234dd599a33b3af0958a4d5ed569d63e3f344f
    - name: Install Rust toolchain
      run: rustup show
    - name: Install mold
      uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444
    - uses: astral-sh/github-actions/rust-workspace-cache@3c9fe5db47e144ea224b57565e3ab1ab769ef41d
      with:
        key: ruff-linux-debug
        add-job-id-key: 'false'
        save-if: 'false'
        prefix-key: ruff-ws-measure-20261022-after
    - name: Build baseline version
      run: |
        cargo build --bin ruff
        mv target/debug/ruff target/debug/ruff-baseline
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        clean: false
    - name: Build comparison version
      run: cargo build --bin ruff
  fuzz-ty:
    name: Fuzz for new ty panics/timeouts
    runs-on: ${{ github.repository == 'astral-sh/ruff' && 'depot-ubuntu-22.04-16' || 'ubuntu-latest' }}
    if: ${{ inputs.case == 'fuzz-ty' }}
    timeout-minutes: ${{ github.repository == 'astral-sh/ruff' && 20 || 40 }}
    permissions:
      contents: read
    env:
      UV_LOCKED: 1
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      CARGO_PROFILE_DEV_LTO: 'false'
      CARGO_PROFILE_DEV_OPT_LEVEL: 0
      CARGO_TERM_COLOR: always
      HAWK_VERSION: 0.1.15
      RUSTUP_MAX_RETRIES: 10
      PACKAGE_NAME: ruff
      PYTHON_VERSION: '3.14'
      NEXTEST_PROFILE: ci
      MDTEST_EXTERNAL: '1'
      CARGO_UNSTABLE_CHECKSUM_FRESHNESS: 'true'
      RUSTC_BOOTSTRAP: '1'
      FUZZ_JOB_TIMEOUT_MINUTES: ${{ github.repository == 'astral-sh/ruff' && 20 || 40 }}
    steps:
    - name: Record job start time
      run: echo "FUZZ_JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Fetch full history without tags
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh auth setup-git
        git fetch --no-tags --filter=blob:none --unshallow origin
    - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
      with:
        version: 0.13.4
        checksum: 2b428396f12572d4429cf210ca234dd599a33b3af0958a4d5ed569d63e3f344f
    - name: Install Rust toolchain
      run: rustup show
    - uses: astral-sh/github-actions/rust-workspace-cache@3c9fe5db47e144ea224b57565e3ab1ab769ef41d
      with:
        profile: profiling
        save-if: 'false'
        prefix-key: ruff-ws-measure-20261022-after
    - name: Install mold
      uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444
    - name: Build comparison binaries
      env:
        FORCE_COLOR: 1
        MERGE_BASE: 7a8f63f0d71a1d381f99652a5fee3b043b32e8e6
        CARGO_PROFILE_PROFILING_DEBUG: line-tables-only
      run: |
        echo "new commit"
        git rev-list --format=%s --max-count=1 "$GITHUB_SHA"
        cargo build --profile=profiling --bin=ty
        mv target/profiling/ty ty-new

        git checkout -b old_commit "$MERGE_BASE"
        echo "old commit (merge base)"
        git rev-list --format=%s --max-count=1 old_commit
        cargo build --profile=profiling --bin=ty
