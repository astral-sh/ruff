name: Measure input timestamp restoration for Ruff's nested workspace
run-name: ${{ inputs.phase }} / ${{ inputs.suite }}
'on':
  workflow_dispatch:
    inputs:
      phase:
        type: choice
        options:
        - seed
        - warm
        default: warm
        required: true
      suite:
        type: string
        default: all
        required: true
      schema-changed:
        type: string
        default: 'false'
        required: false
permissions:
  contents: read
jobs:
  fuzz-build-before:
    name: fuzz-build / before
    runs-on: ${{ github.repository == 'astral-sh/ruff' && 'github-ubuntu-24.04-x86_64-4' || 'ubuntu-latest' }}
    if: ${{ (inputs.suite == 'all' || inputs.suite == 'fuzz-build') }}
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{ inputs.phase == 'seed' && 'acba99d527b8a9fd2e15490df42d0e6d744a4331' || '7a8f63f0d71a1d381f99652a5fee3b043b32e8e6'
          }}
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      with:
        workspaces: fuzz -> target
        save-if: ${{ inputs.phase == 'seed' }}
        prefix-key: ruff-nested-inputs-20261024-v1-fuzz-build-before
      name: Restore Rust cache
      id: rust-cache
    - name: Record Rust cache availability
      if: ${{ inputs.phase == 'warm' }}
      shell: bash
      env:
        CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
        EXPECTED_HIT: 'true'
      run: |-
        echo "Rust cache exact hit: ${CACHE_HIT:-false}"
        test "${CACHE_HIT:-false}" = "$EXPECTED_HIT"
    - name: Install Rust toolchain
      run: rustup show
    - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
      with:
        version: 0.13.5
        checksum: f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f
    - run: uv run --only-dev cargo fuzz build -s none
    env:
      UV_LOCKED: 1
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      CARGO_PROFILE_DEV_LTO: 'false'
      CARGO_PROFILE_DEV_OPT_LEVEL: 0
      CARGO_TERM_COLOR: always
      HAWK_VERSION: 0.1.15
      RUSTUP_MAX_RETRIES: 10
      PACKAGE_NAME: ruff
      PYTHON_VERSION: '3.14'
      NEXTEST_PROFILE: ci
      MDTEST_EXTERNAL: '1'
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
  fuzz-build-current:
    name: fuzz-build / current
    runs-on: ${{ github.repository == 'astral-sh/ruff' && 'github-ubuntu-24.04-x86_64-4' || 'ubuntu-latest' }}
    if: ${{ (inputs.suite == 'all' || inputs.suite == 'fuzz-build') }}
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{ inputs.phase == 'seed' && 'acba99d527b8a9fd2e15490df42d0e6d744a4331' || '7a8f63f0d71a1d381f99652a5fee3b043b32e8e6'
          }}
    - uses: astral-sh/github-actions/rust-workspace-cache@8139eb474ac22fe39bb1e33b50afa426dcdaf455
      with:
        workspace: fuzz
        save-if: ${{ inputs.phase == 'seed' }}
        prefix-key: ruff-nested-inputs-20261024-v1-fuzz-build-current
        profile: |
          release
          x86_64-unknown-linux-gnu/release
      name: Restore Rust cache
      id: rust-cache
    - name: Record Rust cache availability
      if: ${{ inputs.phase == 'warm' }}
      shell: bash
      env:
        CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
        EXPECTED_HIT: 'true'
      run: |-
        echo "Rust cache exact hit: ${CACHE_HIT:-false}"
        test "${CACHE_HIT:-false}" = "$EXPECTED_HIT"
    - name: Install Rust toolchain
      run: rustup show
    - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
      with:
        version: 0.13.5
        checksum: f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f
    - run: uv run --only-dev cargo fuzz build -s none
    env:
      UV_LOCKED: 1
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      CARGO_PROFILE_DEV_LTO: 'false'
      CARGO_PROFILE_DEV_OPT_LEVEL: 0
      CARGO_TERM_COLOR: always
      HAWK_VERSION: 0.1.15
      RUSTUP_MAX_RETRIES: 10
      PACKAGE_NAME: ruff
      PYTHON_VERSION: '3.14'
      NEXTEST_PROFILE: ci
      MDTEST_EXTERNAL: '1'
      CARGO_UNSTABLE_CHECKSUM_FRESHNESS: 'true'
      RUSTC_BOOTSTRAP: '1'
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
  fuzz-build-after:
    name: fuzz-build / after
    runs-on: ${{ github.repository == 'astral-sh/ruff' && 'github-ubuntu-24.04-x86_64-4' || 'ubuntu-latest' }}
    if: ${{ (inputs.suite == 'all' || inputs.suite == 'fuzz-build') }}
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{ inputs.phase == 'seed' && 'acba99d527b8a9fd2e15490df42d0e6d744a4331' || '7a8f63f0d71a1d381f99652a5fee3b043b32e8e6'
          }}
    - uses: astral-sh/github-actions/rust-workspace-cache@243f4258608cb0f0dace8009ef4c5d8fbd3986c3
      with:
        workspace: fuzz
        save-if: ${{ inputs.phase == 'seed' }}
        prefix-key: ruff-nested-inputs-20261024-v1-fuzz-build-after
        profile: |
          release
          x86_64-unknown-linux-gnu/release
      name: Restore Rust cache
      id: rust-cache
    - name: Record Rust cache availability
      if: ${{ inputs.phase == 'warm' }}
      shell: bash
      env:
        CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
        EXPECTED_HIT: 'true'
      run: |-
        echo "Rust cache exact hit: ${CACHE_HIT:-false}"
        test "${CACHE_HIT:-false}" = "$EXPECTED_HIT"
    - name: Install Rust toolchain
      run: rustup show
    - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
      with:
        version: 0.13.5
        checksum: f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f
    - run: uv run --only-dev cargo fuzz build -s none
    env:
      UV_LOCKED: 1
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      CARGO_PROFILE_DEV_LTO: 'false'
      CARGO_PROFILE_DEV_OPT_LEVEL: 0
      CARGO_TERM_COLOR: always
      HAWK_VERSION: 0.1.15
      RUSTUP_MAX_RETRIES: 10
      PACKAGE_NAME: ruff
      PYTHON_VERSION: '3.14'
      NEXTEST_PROFILE: ci
      MDTEST_EXTERNAL: '1'
      CARGO_UNSTABLE_CHECKSUM_FRESHNESS: 'true'
      RUSTC_BOOTSTRAP: '1'
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
