    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        clean: false
        ref: ${{ inputs.phase == 'seed' && 'acba99d527b8a9fd2e15490df42d0e6d744a4331' || '7a8f63f0d71a1d381f99652a5fee3b043b32e8e6'
          }}
    - name: Build comparison version
      run: cargo build --bin ruff
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
  ecosystem-after:
    name: ecosystem / after
    runs-on: ${{ github.repository == 'astral-sh/ruff' && 'depot-ubuntu-24.04-8' || 'ubuntu-latest' }}
    if: ${{ inputs.phase == 'warm' && (inputs.suite == 'all' || inputs.suite == 'ecosystem') }}
    timeout-minutes: 20
    env:
      UV_LOCKED: 1
