          \ appended to `assertion_buf` so they appear in the panic message.\n+    /// GitHub annotations are also printed on\
          \ separate lines so the runner can\n+    /// recognize them when the test runner displays captured output.\n     #[expect(clippy::print_stdout)]\n\
          \     fn write_error(\n         self,\n@@ -197,31 +189,27 @@ impl OutputFormat {\n         line: OneIndexed,\n   \
          \      failure: &Failure,\n     ) {\n-        match self {\n-            OutputFormat::Cli => {\n-               \
          \ let _ = writeln!(\n-                    assertion_buf,\n-                    \"{file_line} {message}\",\n-     \
          \               file_line = format!(\"{file}:{line}\").cyan(),\n-                    message = Indented(failure.message()),\n\
          -                );\n-                if let Some((expected, actual)) = failure.diff() {\n-                    let\
          \ _ = render_diff(assertion_buf, actual, expected);\n-                }\n-            }\n-            OutputFormat::GitHub\
          \ => {\n-                println!(\n-                    \"::error file={file},line={line}::{message}\",\n-      \
          \              message = failure.message()\n-                );\n-            }\n+        let _ = writeln!(\n+   \
          \         assertion_buf,\n+            \"{file_line} {message}\",\n+            file_line = format!(\"{file}:{line}\"\
          ).cyan(),\n+            message = Indented(failure.message()),\n+        );\n+        if let Some((expected, actual))\
          \ = failure.diff() {\n+            let _ = render_diff(assertion_buf, actual, expected);\n+        }\n+        if\
          \ matches!(self, Self::GitHub) {\n+            println!(\n+                \"::error file={file},line={line}::{message}\"\
          ,\n+                message = failure.message()\n+            );\n         }\n     }\n \n     /// Write a module-resolution\
