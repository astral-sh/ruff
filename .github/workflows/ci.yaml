  annotation-probe:
    name: Captured annotation output
    if: ${{ inputs.suite == 'annotation-probe' }}
    runs-on: depot-ubuntu-22.04-16
    timeout-minutes: 10
    env:
      CARGO_TERM_COLOR: always
      UV_LOCKED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ inputs.source }}
      - name: Install Rust toolchain
        run: rustup show
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: 0.13.5
          checksum: f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f
      - name: Check captured annotation output
        shell: bash
        run: |
          probe_dir="$HOME/code/tmp/annotation-probe"
          mkdir -p "$probe_dir/src"
          cat > "$probe_dir/Cargo.toml" <<'TOML'
          [package]
          name = "annotation-probe"
          version = "0.1.0"
          edition = "2024"
          TOML
          cat > "$probe_dir/src/lib.rs" <<'RUST'
          #[test]
          fn captured_annotation() {
              println!("::error file=.github/workflows/ci.yaml,line=1::Intentional captured-output annotation probe");
              panic!("intentional failure to inspect annotation handling");
          }
          RUST
          set +e
          uv run --locked --only-dev cargo nextest run \
            --manifest-path "$probe_dir/Cargo.toml" \
            --failure-output immediate-final --status-level skip
          result=$?
          set -e
          test "$result" -eq 100
