    - name: Install Rust toolchain
      run: rustup show
    - uses: astral-sh/github-actions/rust-workspace-cache@8139eb474ac22fe39bb1e33b50afa426dcdaf455
      with:
        key: ruff-binary-debug
        add-job-id-key: 'false'
        save-if: 'false'
        prefix-key: ruff-aged-shared-20261024-v1-ruff-binary-after
      name: Restore Rust cache
      id: rust-cache
    - name: Record Rust cache availability
      if: ${{ inputs.phase == 'warm' }}
      shell: bash
      env:
        CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
        EXPECTED_HIT: 'true'
      run: |-
        echo "Rust cache exact hit: ${CACHE_HIT:-false}"
        test "${CACHE_HIT:-false}" = "$EXPECTED_HIT"
    - name: Build baseline version
      run: |
        cargo build --bin ruff
        mv target/debug/ruff target/debug/ruff-baseline
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        clean: false
        ref: ${{ inputs.phase == 'seed' && 'acba99d527b8a9fd2e15490df42d0e6d744a4331' || '7a8f63f0d71a1d381f99652a5fee3b043b32e8e6'
          }}
    - name: Build comparison version
      run: cargo build --bin ruff
    permissions:
      contents: read
    defaults:
