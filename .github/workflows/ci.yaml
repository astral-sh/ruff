name: Measure native Rust cache across runner images
'on':
  workflow_dispatch: {}
permissions:
  contents: read
env:
  CARGO_UNSTABLE_CHECKSUM_FRESHNESS: 'true'
  RUSTC_BOOTSTRAP: '1'
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
defaults:
  run:
    shell: bash
jobs:
  producer:
    runs-on: depot-ubuntu-24.04-8
    timeout-minutes: 15
    env:
      REQUIRE_FRESH: 'false'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: 7a8f63f0d71a1d381f99652a5fee3b043b32e8e6
        persist-credentials: false
    - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
      with:
        version: 0.13.5
        enable-cache: false
    - name: Select pinned Rust compiler
      run: 'rustup show

        rustc -vV'
    - name: Restore Rust cache
      id: rust-cache
      uses: astral-sh/github-actions/rust-workspace-cache@9d742affd1d1cbecb16aeb03a6b0b19dce8be61c
      with:
        prefix-key: ruff-native-cross-20261024-v1
        key: ruff-binary-debug
        add-job-id-key: 'false'
        save-if: 'true'
    - name: Build Ruff
      run: cargo build --locked --bin ruff --message-format=json > "$RUNNER_TEMP/build.json"
    - name: Record compilation reuse
      run: "python3 - <<'PYTHON'\nimport json,os\nfrom pathlib import Path\nrows=[json.loads(line) for line in (Path(os.environ['RUNNER_TEMP'])/'build.json').read_text().splitlines()\
        \ if line.startswith('{')]\nrows=[r for r in rows if r['reason']=='compiler-artifact']\nprint('Fresh artifacts:',sum(r['fresh']\
        \ for r in rows),'/',len(rows))\nprint('Recompiled:',[r['target']['name'] for r in rows if not r['fresh']])\nif os.environ['REQUIRE_FRESH']=='true':\n\
        \ assert rows and all(r['fresh'] for r in rows)\nPYTHON"
  consumer:
    needs: producer
    runs-on: github-ubuntu-24.04-x86_64-4
    timeout-minutes: 15
    env:
      REQUIRE_FRESH: 'true'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: 7a8f63f0d71a1d381f99652a5fee3b043b32e8e6
        persist-credentials: false
    - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
      with:
        version: 0.13.5
        enable-cache: false
    - name: Select pinned Rust compiler
      run: 'rustup show

        rustc -vV'
    - name: Restore Rust cache
      id: rust-cache
      uses: astral-sh/github-actions/rust-workspace-cache@9d742affd1d1cbecb16aeb03a6b0b19dce8be61c
      with:
        prefix-key: ruff-native-cross-20261024-v1
        key: ruff-binary-debug
        add-job-id-key: 'false'
        save-if: 'false'
    - name: Require shared cache hit
      env:
        CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
      run: test "$CACHE_HIT" = true
    - name: Build Ruff
      run: cargo build --locked --bin ruff --message-format=json > "$RUNNER_TEMP/build.json"
    - name: Record compilation reuse
      run: "python3 - <<'PYTHON'\nimport json,os\nfrom pathlib import Path\nrows=[json.loads(line) for line in (Path(os.environ['RUNNER_TEMP'])/'build.json').read_text().splitlines()\
        \ if line.startswith('{')]\nrows=[r for r in rows if r['reason']=='compiler-artifact']\nprint('Fresh artifacts:',sum(r['fresh']\
        \ for r in rows),'/',len(rows))\nprint('Recompiled:',[r['target']['name'] for r in rows if not r['fresh']])\nif os.environ['REQUIRE_FRESH']=='true':\n\
        \ assert rows and all(r['fresh'] for r in rows)\nPYTHON"
