name: Measure native Rust cache
run-name: ${{ inputs.phase }} / ${{ inputs.suite }}
'on':
  workflow_dispatch:
    inputs:
      phase:
        type: choice
        options:
        - seed
        - warm
        default: warm
        required: true
      suite:
        type: string
        default: all
        required: true
      schema-changed:
        type: string
        default: 'false'
        required: false
permissions:
  contents: read
jobs:
  clippy-before:
    name: clippy / before
    runs-on: ${{ github.repository == 'astral-sh/ruff' && 'github-ubuntu-24.04-x86_64-4' || 'ubuntu-latest' }}
    if: ${{ (inputs.suite == 'all' || inputs.suite == 'clippy') }}
    timeout-minutes: 20
    env:
      UV_LOCKED: 1
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      CARGO_PROFILE_DEV_LTO: 'false'
      CARGO_PROFILE_DEV_OPT_LEVEL: 0
      CARGO_TERM_COLOR: always
      HAWK_VERSION: 0.1.15
      RUSTUP_MAX_RETRIES: 10
      PACKAGE_NAME: ruff
      PYTHON_VERSION: '3.14'
      NEXTEST_PROFILE: ci
      MDTEST_EXTERNAL: '1'
      CARGO_BUILD_WARNINGS: deny
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: 7a8f63f0d71a1d381f99652a5fee3b043b32e8e6
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      with:
        save-if: ${{ inputs.phase == 'seed' }}
        prefix-key: ruff-native-20261024-v1-clippy-before
      name: Restore Rust cache
      id: rust-cache
    - name: Record Rust cache availability
      if: ${{ inputs.phase == 'warm' }}
      shell: bash
      env:
        CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
        EXPECTED_HIT: 'true'
      run: |-
        echo "Rust cache exact hit: ${CACHE_HIT:-false}"
        test "${CACHE_HIT:-false}" = "$EXPECTED_HIT"
    - name: Install Rust toolchain
      run: |
        rustup component add clippy
        rustup target add wasm32-unknown-unknown
    - name: Clippy
      run: cargo clippy --workspace --all-targets --all-features --locked
    - name: Clippy (wasm)
      run: cargo clippy -p ruff_wasm -p ty_wasm --target wasm32-unknown-unknown --all-features --locked
    permissions:
      contents: read
    defaults:
      run: &id001
        shell: bash
  clippy-after:
    name: clippy / after
    runs-on: ${{ github.repository == 'astral-sh/ruff' && 'github-ubuntu-24.04-x86_64-4' || 'ubuntu-latest' }}
    if: ${{ (inputs.suite == 'all' || inputs.suite == 'clippy') }}
    timeout-minutes: 20
    env:
      UV_LOCKED: 1
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      CARGO_PROFILE_DEV_LTO: 'false'
      CARGO_PROFILE_DEV_OPT_LEVEL: 0
      CARGO_TERM_COLOR: always
      HAWK_VERSION: 0.1.15
      RUSTUP_MAX_RETRIES: 10
      PACKAGE_NAME: ruff
      PYTHON_VERSION: '3.14'
      NEXTEST_PROFILE: ci
      MDTEST_EXTERNAL: '1'
      CARGO_BUILD_WARNINGS: deny
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: 7a8f63f0d71a1d381f99652a5fee3b043b32e8e6
    - uses: astral-sh/github-actions/rust-workspace-cache@4f88db2c55c0e0588aaae819ef0ef95e4924c753
      with:
        cache-workspace-crates: 'false'
        save-if: ${{ inputs.phase == 'seed' }}
        prefix-key: ruff-native-20261024-v1-clippy-after
      name: Restore Rust cache
      id: rust-cache
    - name: Record Rust cache availability
      if: ${{ inputs.phase == 'warm' }}
      shell: bash
      env:
        CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
        EXPECTED_HIT: 'true'
      run: |-
        echo "Rust cache exact hit: ${CACHE_HIT:-false}"
        test "${CACHE_HIT:-false}" = "$EXPECTED_HIT"
    - name: Install Rust toolchain
      run: |
        rustup component add clippy
        rustup target add wasm32-unknown-unknown
    - name: Clippy
      run: cargo clippy --workspace --all-targets --all-features --locked
    - name: Clippy (wasm)
      run: cargo clippy -p ruff_wasm -p ty_wasm --target wasm32-unknown-unknown --all-features --locked
    permissions:
      contents: read
    defaults:
      run: &id002
        shell: bash
  hawk-before:
    name: hawk / before
    runs-on: ${{ github.repository == 'astral-sh/ruff' && 'github-ubuntu-24.04-x86_64-4' || 'ubuntu-latest' }}
    if: ${{ (inputs.suite == 'all' || inputs.suite == 'hawk') }}
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: 7a8f63f0d71a1d381f99652a5fee3b043b32e8e6
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      with:
        workspaces: . -> target/hawk
        cache-workspace-crates: 'false'
        save-if: ${{ inputs.phase == 'seed' }}
        prefix-key: ruff-native-20261024-v1-hawk-before
      name: Restore Rust cache
      id: rust-cache
    - name: Record Rust cache availability
      if: ${{ inputs.phase == 'warm' }}
      shell: bash
      env:
        CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
        EXPECTED_HIT: 'true'
      run: |-
        echo "Rust cache exact hit: ${CACHE_HIT:-false}"
        test "${CACHE_HIT:-false}" = "$EXPECTED_HIT"
    - name: Install Rust toolchain
      run: rustup toolchain install 1.99.0
    - name: Install Hawk
      run: |
        curl --proto '=https' --tlsv1.2 -LsSf \
          "https://github.com/astral-sh/hawk/releases/download/${HAWK_VERSION}/cargo-hawk-installer.sh" | sh
    - name: Hawk
      run: cargo +1.99.0 hawk check --target-dir target/hawk --color=always -D warnings
    env:
      UV_LOCKED: 1
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      CARGO_PROFILE_DEV_LTO: 'false'
      CARGO_PROFILE_DEV_OPT_LEVEL: 0
      CARGO_TERM_COLOR: always
      HAWK_VERSION: 0.1.15
      RUSTUP_MAX_RETRIES: 10
      PACKAGE_NAME: ruff
      PYTHON_VERSION: '3.14'
      NEXTEST_PROFILE: ci
      MDTEST_EXTERNAL: '1'
    permissions:
      contents: read
    defaults:
      run: *id001
  hawk-after:
    name: hawk / after
    runs-on: ${{ github.repository == 'astral-sh/ruff' && 'github-ubuntu-24.04-x86_64-4' || 'ubuntu-latest' }}
    if: ${{ (inputs.suite == 'all' || inputs.suite == 'hawk') }}
    timeout-minutes: 15
    env:
      UV_LOCKED: 1
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      CARGO_PROFILE_DEV_LTO: 'false'
      CARGO_PROFILE_DEV_OPT_LEVEL: 0
      CARGO_TERM_COLOR: always
      HAWK_VERSION: 0.1.15
      RUSTUP_MAX_RETRIES: 10
      PACKAGE_NAME: ruff
      PYTHON_VERSION: '3.14'
      NEXTEST_PROFILE: ci
      MDTEST_EXTERNAL: '1'
      RUSTUP_TOOLCHAIN: 1.99.0
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: 7a8f63f0d71a1d381f99652a5fee3b043b32e8e6
    - name: Install Rust toolchain
      run: rustup toolchain install 1.99.0
    - uses: astral-sh/github-actions/rust-workspace-cache@4f88db2c55c0e0588aaae819ef0ef95e4924c753
      with:
        target-directory: target/hawk
        cache-workspace-crates: 'false'
        save-if: ${{ inputs.phase == 'seed' }}
        prefix-key: ruff-native-20261024-v1-hawk-after
      name: Restore Rust cache
      id: rust-cache
    - name: Record Rust cache availability
      if: ${{ inputs.phase == 'warm' }}
      shell: bash
      env:
        CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
        EXPECTED_HIT: 'true'
      run: |-
        echo "Rust cache exact hit: ${CACHE_HIT:-false}"
        test "${CACHE_HIT:-false}" = "$EXPECTED_HIT"
    - name: Install Hawk
      run: |
        curl --proto '=https' --tlsv1.2 -LsSf \
          "https://github.com/astral-sh/hawk/releases/download/${HAWK_VERSION}/cargo-hawk-installer.sh" | sh
    - name: Hawk
      run: cargo +1.99.0 hawk check --target-dir target/hawk --color=always -D warnings
    permissions:
      contents: read
    defaults:
      run: *id002
  publish-before:
    name: publish / before
    runs-on: ${{ github.repository == 'astral-sh/ruff' && 'depot-ubuntu-22.04-8' || 'ubuntu-latest' }}
    if: ${{ (inputs.suite == 'all' || inputs.suite == 'publish') }}
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: 7a8f63f0d71a1d381f99652a5fee3b043b32e8e6
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      with:
        save-if: ${{ inputs.phase == 'seed' }}
        prefix-key: ruff-native-20261024-v1-publish-before
      name: Restore Rust cache
      id: rust-cache
    - name: Record Rust cache availability
      if: ${{ inputs.phase == 'warm' }}
      shell: bash
      env:
        CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
        EXPECTED_HIT: 'true'
      run: |-
        echo "Rust cache exact hit: ${CACHE_HIT:-false}"
        test "${CACHE_HIT:-false}" = "$EXPECTED_HIT"
    - name: cargo publish dry-run
      run: cargo publish --workspace --dry-run
    env:
      UV_LOCKED: 1
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      CARGO_PROFILE_DEV_LTO: 'false'
      CARGO_PROFILE_DEV_OPT_LEVEL: 0
      CARGO_TERM_COLOR: always
      HAWK_VERSION: 0.1.15
      RUSTUP_MAX_RETRIES: 10
      PACKAGE_NAME: ruff
      PYTHON_VERSION: '3.14'
      NEXTEST_PROFILE: ci
      MDTEST_EXTERNAL: '1'
    permissions:
      contents: read
    defaults:
      run: *id001
  publish-after:
    name: publish / after
    runs-on: ${{ github.repository == 'astral-sh/ruff' && 'depot-ubuntu-22.04-8' || 'ubuntu-latest' }}
    if: ${{ (inputs.suite == 'all' || inputs.suite == 'publish') }}
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: 7a8f63f0d71a1d381f99652a5fee3b043b32e8e6
    - uses: astral-sh/github-actions/rust-workspace-cache@4f88db2c55c0e0588aaae819ef0ef95e4924c753
      with:
        cache-workspace-crates: 'false'
        save-if: ${{ inputs.phase == 'seed' }}
        prefix-key: ruff-native-20261024-v1-publish-after
      name: Restore Rust cache
      id: rust-cache
    - name: Record Rust cache availability
      if: ${{ inputs.phase == 'warm' }}
      shell: bash
      env:
        CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
        EXPECTED_HIT: 'true'
      run: |-
        echo "Rust cache exact hit: ${CACHE_HIT:-false}"
        test "${CACHE_HIT:-false}" = "$EXPECTED_HIT"
    - name: cargo publish dry-run
      run: cargo publish --workspace --dry-run
    env:
      UV_LOCKED: 1
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      CARGO_PROFILE_DEV_LTO: 'false'
      CARGO_PROFILE_DEV_OPT_LEVEL: 0
      CARGO_TERM_COLOR: always
      HAWK_VERSION: 0.1.15
      RUSTUP_MAX_RETRIES: 10
      PACKAGE_NAME: ruff
      PYTHON_VERSION: '3.14'
      NEXTEST_PROFILE: ci
      MDTEST_EXTERNAL: '1'
    permissions:
      contents: read
    defaults:
      run: *id002
  linux-before:
    name: linux / before
    runs-on: ${{ github.repository == 'astral-sh/ruff' && 'depot-ubuntu-22.04-16' || 'ubuntu-latest' }}
    if: ${{ (inputs.suite == 'all' || inputs.suite == 'linux') }}
    timeout-minutes: 20
    env:
      UV_LOCKED: 1
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      CARGO_PROFILE_DEV_LTO: 'false'
      CARGO_PROFILE_DEV_OPT_LEVEL: 0
      CARGO_TERM_COLOR: always
      HAWK_VERSION: 0.1.15
      RUSTUP_MAX_RETRIES: 10
      PACKAGE_NAME: ruff
      PYTHON_VERSION: '3.14'
      NEXTEST_PROFILE: ci
      MDTEST_EXTERNAL: '1'
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: 7a8f63f0d71a1d381f99652a5fee3b043b32e8e6
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      with:
        shared-key: ruff-linux-debug
        save-if: ${{ inputs.phase == 'seed' }}
        prefix-key: ruff-native-20261024-v1-linux-before
      name: Restore Rust cache
      id: rust-cache
    - name: Record Rust cache availability
      if: ${{ inputs.phase == 'warm' }}
      shell: bash
      env:
        CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
        EXPECTED_HIT: 'true'
      run: |-
        echo "Rust cache exact hit: ${CACHE_HIT:-false}"
        test "${CACHE_HIT:-false}" = "$EXPECTED_HIT"
    - name: Install Rust toolchain
      run: rustup show
    - name: Install uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
      with:
        version: 0.13.4
        checksum: 2b428396f12572d4429cf210ca234dd599a33b3af0958a4d5ed569d63e3f344f
        enable-cache: 'true'
        cache-python: true
    - name: ty mdtests (GitHub annotations)
      if: ${{ inputs.phase == 'warm' }}
      env:
        NO_COLOR: 1
        MDTEST_GITHUB_ANNOTATIONS_FORMAT: 1
      run: cargo test -p ty_python_semantic --test mdtest || true
    - name: Run tests
      run: uv run --locked --only-dev cargo insta test --all-features --unreferenced reject --test-runner nextest --disable-nextest-doctest
    - name: Run doctests
      run: cargo test --doc --all-features
    - name: Check parser without stacker
      run: cargo check --locked -p ruff_python_parser --no-default-features --all-targets
    - name: Dogfood ty on py-fuzzer
      run: uv run --quiet --python="${PYTHON_VERSION}" --project=./python/py-fuzzer cargo run --quiet -p ty check --project=./python/py-fuzzer
        --color=always
    - name: Dogfood ty on ty_benchmark
      run: uv run --quiet --project=./scripts/ty_benchmark cargo run --quiet -p ty check --project=./scripts/ty_benchmark
        --color=always
    - name: Dogfood ty on scripts
      env:
        TY_UV: scripts
        UV_LOCKED: 'true'
        UV_PYTHON: ${{ env.PYTHON_VERSION }}
      run: |
        uv run --locked scripts/check-scripts.py --write-ty-args-file "$RUNNER_TEMP/script-paths.txt"
        cargo run --quiet -p ty check "@$RUNNER_TEMP/script-paths.txt" --color=always
    - run: cargo doc --all --no-deps
      env:
        RUSTDOCFLAGS: -D warnings
    - run: cargo doc --no-deps -p ty_python_semantic -p ty_python_core -p ty_module_resolver -p ty_site_packages -p ty_combine
        -p ty_project -p ty_ide -p ty_wasm -p ty_vendored -p ty_static -p ty -p ty_test -p ruff_db -p ruff_python_formatter
        --document-private-items
      env:
        RUSTDOCFLAGS: -D warnings
    permissions:
      contents: read
    defaults:
      run: *id001
  linux-after:
    name: linux / after
    runs-on: ${{ github.repository == 'astral-sh/ruff' && 'depot-ubuntu-22.04-16' || 'ubuntu-latest' }}
    if: ${{ (inputs.suite == 'all' || inputs.suite == 'linux') }}
    timeout-minutes: 20
    env:
      UV_LOCKED: 1
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      CARGO_PROFILE_DEV_LTO: 'false'
