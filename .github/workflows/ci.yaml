      CONFORMANCE_SUITE_COMMIT: d06c5dd6bbae4a39eb7cb0210c5b2099aafd8032
      PYTHON_VERSION: 3.12
      MEASURE_OLD_SOURCE: acba99d527b8a9fd2e15490df42d0e6d744a4331
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        path: ruff
        persist-credentials: false
        ref: ${{ inputs.phase == 'seed' && 'acba99d527b8a9fd2e15490df42d0e6d744a4331' || '7a8f63f0d71a1d381f99652a5fee3b043b32e8e6'
          }}
    - name: Fetch full history without tags
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh auth setup-git
        git -C ruff fetch --no-tags --filter=blob:none --unshallow origin
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: python/typing
        ref: ${{ env.CONFORMANCE_SUITE_COMMIT }}
        path: typing
        persist-credentials: false
    - name: Install Rust toolchain
      run: rustup show
      working-directory: ruff
    - uses: astral-sh/github-actions/rust-workspace-cache@8139eb474ac22fe39bb1e33b50afa426dcdaf455
      with:
        workspace: ruff
        prefix-key: ruff-aged-typing-20261024-v1-current
        save-if: ${{ inputs.phase == 'seed' }}
        cache-workspace-crates: 'false'
      name: Restore Rust cache
      id: rust-cache
    - name: Record Rust cache availability
      if: ${{ inputs.phase == 'warm' }}
      shell: bash
      env:
        CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
        EXPECTED_HIT: 'true'
      run: |-
        echo "Rust cache exact hit: ${CACHE_HIT:-false}"
        test "${CACHE_HIT:-false}" = "$EXPECTED_HIT"
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    - name: Compute diagnostic diff
      shell: bash
      run: |
        # Build the executable for the old and new commit
        (
          cd ruff

          echo "new commit"
          git rev-list --format=%s --max-count=1 HEAD
          echo "Measured source revision: $(git rev-parse HEAD)"
          cargo build --bin ty
          mv target/debug/ty ty-new

            MERGE_BASE="$MEASURE_OLD_SOURCE"
          git checkout -b old_commit "$MERGE_BASE"
          echo "old commit (merge base)"
          git rev-list --format=%s --max-count=1 old_commit
          echo "Measured source revision: $(git rev-parse HEAD)"
          cargo build --bin ty
          mv target/debug/ty ty-old
        )

        (
          echo "Creating comment with conformance comparison"
          cd ruff
          git switch - --detach

          python "./scripts/conformance.py" \
           --old-ty "./ty-old" \
           --new-ty "./ty-new" \
           --tests-path "${GITHUB_WORKSPACE}/typing/conformance/" \
           --python-version "$PYTHON_VERSION" \
           --output ../typing_conformance_diagnostics.diff
        )
    - name: Upload diff
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: typing_conformance_diagnostics_diff-typing-after
        path: typing_conformance_diagnostics.diff
        retention-days: 1
    if: ${{ (inputs.suite == 'all' || inputs.suite == 'typing') }}
    permissions:
      contents: read
  typing-after:
    name: typing / after
    runs-on: ${{ github.repository == 'astral-sh/ruff' && 'depot-ubuntu-22.04-32' || 'ubuntu-latest' }}
    timeout-minutes: 10
    env:
      UV_LOCKED: 1
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      CARGO_TERM_COLOR: always
      RUSTUP_MAX_RETRIES: 10
      RUST_BACKTRACE: 1
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_DEV_LTO: 'false'
      CARGO_PROFILE_DEV_OPT_LEVEL: 0
      CONFORMANCE_SUITE_COMMIT: d06c5dd6bbae4a39eb7cb0210c5b2099aafd8032
      PYTHON_VERSION: 3.12
      CARGO_UNSTABLE_CHECKSUM_FRESHNESS: 'true'
      RUSTC_BOOTSTRAP: '1'
      MEASURE_OLD_SOURCE: acba99d527b8a9fd2e15490df42d0e6d744a4331
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        path: ruff
        persist-credentials: false
        ref: ${{ inputs.phase == 'seed' && 'acba99d527b8a9fd2e15490df42d0e6d744a4331' || '7a8f63f0d71a1d381f99652a5fee3b043b32e8e6'
          }}
    - name: Fetch full history without tags
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh auth setup-git
        git -C ruff fetch --no-tags --filter=blob:none --unshallow origin
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: python/typing
        ref: ${{ env.CONFORMANCE_SUITE_COMMIT }}
        path: typing
        persist-credentials: false
    - name: Install Rust toolchain
      run: rustup show
      working-directory: ruff
    - uses: astral-sh/github-actions/rust-workspace-cache@8139eb474ac22fe39bb1e33b50afa426dcdaf455
      with:
        workspace: ruff
        prefix-key: ruff-aged-typing-20261024-v1-after
        save-if: ${{ inputs.phase == 'seed' }}
      name: Restore Rust cache
      id: rust-cache
    - name: Record Rust cache availability
      if: ${{ inputs.phase == 'warm' }}
      shell: bash
      env:
        CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
        EXPECTED_HIT: 'true'
      run: |-
        echo "Rust cache exact hit: ${CACHE_HIT:-false}"
        test "${CACHE_HIT:-false}" = "$EXPECTED_HIT"
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    - name: Compute diagnostic diff
      shell: bash
      run: |
        # Build the executable for the old and new commit
        (
          cd ruff

          echo "new commit"
          git rev-list --format=%s --max-count=1 HEAD
          echo "Measured source revision: $(git rev-parse HEAD)"
          cargo build --bin ty
