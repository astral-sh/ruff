name: Select pull request reviewers

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pull-request:
        description: Pull request number
        required: true
        type: string

permissions: {}

env:
  UV_LOCKED: 1

jobs:
  dispatch:
    if: >-
      github.repository == 'astral-sh/ruff' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft && vars.KEY_VALUE_SERVICE_URL != ''
    uses: astral-sh/ruff/.github/workflows/dispatch-pull-request-reviewer.yml@fb3919b95857263335174dbea27c26cfb22d5d3d
    secrets:
      STS_API_URL: ${{ secrets.STS_API_URL }}
    permissions:
      id-token: write

  assign:
    if: >-
      github.repository == 'astral-sh/ruff' &&
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: github-ubuntu-24.04-x86_64-2
    timeout-minutes: 10
    environment: automations
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: pull-request-reviewer-round-robin
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            scripts
            .github/pr-reviewer-pools.toml
            .github/pr-assignee-pools.toml
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # renovate: datasource=github-release-attachments depName=astral-sh/uv
          version: "0.13.4"
          checksum: "2b428396f12572d4429cf210ca234dd599a33b3af0958a4d5ed569d63e3f344f"
          python-version: "3.13"
          enable-cache: false
      - name: Read reviewer credits
        uses: astral-sh/github-actions/key-value-store/get@a45012f200a3a3fe3c319eaa34c9fa13c71f8f26
        with:
          service-url: ${{ vars.KEY_VALUE_SERVICE_URL }}
          key: reviewer-round-robin-v1
          path: ${{ runner.temp }}/reviewer-state-${{ github.run_id }}-${{ github.run_attempt }}.json
      - name: Get a reviewer token
        id: token
        uses: open-security-tools/ost-simple-sts@9e012247e07c39080fb6a832dbfbcfeacebc19c4
        with:
          exchange-url: ${{ secrets.STS_API_URL }}/exchange
          audience: ${{ secrets.STS_API_URL }}
          repository: astral-sh/ruff
          permissions: |
            pull_requests: write
      - name: Request a reviewer
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PULL_REQUEST: ${{ inputs.pull-request }}
          REVIEWER_STATE: ${{ runner.temp }}/reviewer-state-${{ github.run_id }}-${{ github.run_attempt }}.json
          NEXT_REVIEWER_STATE: ${{ runner.temp }}/reviewer-state-next-${{ github.run_id }}-${{ github.run_attempt }}.json
          LEGACY_REVIEWER_STATE: ${{ vars.PR_REVIEWER_ROUND_ROBIN_STATE || vars.PR_ASSIGNEE_ROUND_ROBIN_STATE }}
        run: >-
          uv run --script scripts/pull_request_reviewers.py
          --pull-request "$PULL_REQUEST" --state "$REVIEWER_STATE"
          --output "$NEXT_REVIEWER_STATE"
      - name: Store reviewer credits
        uses: astral-sh/github-actions/key-value-store/put@a45012f200a3a3fe3c319eaa34c9fa13c71f8f26
        with:
          service-url: ${{ vars.KEY_VALUE_SERVICE_URL }}
          key: reviewer-round-robin-v1
          path: ${{ runner.temp }}/reviewer-state-next-${{ github.run_id }}-${{ github.run_attempt }}.json
