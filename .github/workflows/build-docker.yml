# Build Docker images in Depot, then publish saved release images.
name: "[ruff] Build Docker images"

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string
  pull_request:
    paths:
      - .github/workflows/build-docker.yml
      - .github/workflows/publish-docker-image.yml
      - Dockerfile

env:
  UV_LOCKED: 1
  ACTIONS_CACHE_MODE: none

permissions:
  contents: read

jobs:
  plan:
    runs-on: ${{ github.repository == 'astral-sh/ruff' && 'github-ubuntu-24.04-x86_64-4' || 'ubuntu-latest' }}
    timeout-minutes: 2
    outputs:
      depot-project-id: ${{ steps.plan.outputs.depot-project-id }}
      images: ${{ steps.plan.outputs.images }}
      ghcr-image: ${{ steps.plan.outputs.ghcr-image }}
      login: ${{ steps.plan.outputs.login }}
      publish: ${{ steps.plan.outputs.publish }}
      mode: ${{ steps.plan.outputs.mode }}
      save: ${{ steps.plan.outputs.save }}
      version: ${{ steps.plan.outputs.version }}
      extra-images: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Plan images
        id: plan
        uses: astral-sh/github-actions/docker-plan@f9f03918930a74747a62150c3f009db66d171c5e
        with:
          name: ruff
          plan: ${{ inputs.plan }}
          production-project: ${{ vars.DEPOT_PROJECT_PROD }}
          development-project: ${{ vars.DEPOT_PROJECT_DEV }}
          image-mappings: |
            alpine:3.23,alpine3.23,alpine
            debian:trixie-slim,trixie-slim,debian-slim
            buildpack-deps:trixie,trixie,debian

  build-base:
    name: build ruff
    needs: plan
    runs-on: ${{ github.repository == 'astral-sh/ruff' && 'github-ubuntu-24.04-x86_64-4' || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    outputs:
      build-id: ${{ steps.build.outputs.build-id }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      # Authenticate read-only pulls to avoid Docker Hub's anonymous rate limits.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: ${{ needs.plan.outputs.login == 'true' }}
        with:
          username: astralshbot
          password: ${{ secrets.DOCKERHUB_TOKEN_RO }}

      - name: Build image
        id: build
        uses: astral-sh/github-actions/docker-build@f9f03918930a74747a62150c3f009db66d171c5e
        with:
          name: ruff
          project: ${{ needs.plan.outputs.depot-project-id }}
          images: ${{ needs.plan.outputs.images }}
          save: ${{ needs.plan.outputs.save }}
          mode: ${{ needs.plan.outputs.mode }}
          version: ${{ needs.plan.outputs.version }}

  build-extra:
    name: build ${{ matrix.image-mapping }}
    needs: [plan, build-base]
    runs-on: ${{ github.repository == 'astral-sh/ruff' && 'github-ubuntu-24.04-x86_64-4' || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.extra-images) }}
    steps:
      # Authenticate read-only pulls to avoid Docker Hub's anonymous rate limits.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: ${{ needs.plan.outputs.login == 'true' }}
        with:
          username: astralshbot
          password: ${{ secrets.DOCKERHUB_TOKEN_RO }}

      - name: Generate Dockerfile and aliases
        id: variant
        uses: astral-sh/github-actions/docker-variant@f9f03918930a74747a62150c3f009db66d171c5e
        with:
          image-mapping: ${{ matrix.image-mapping }}
          # Unsaved builds use the published base image.
          source-image: ${{ needs.plan.outputs.save == 'true' && format('registry.depot.dev/{0}@{1}', needs.plan.outputs.depot-project-id, needs.build-base.outputs.digest) || format('{0}:latest', needs.plan.outputs.ghcr-image) }}
          binaries: ruff

      - name: Build image
        uses: astral-sh/github-actions/docker-build@f9f03918930a74747a62150c3f009db66d171c5e
        with:
          name: ${{ steps.variant.outputs.name }}
          project: ${{ needs.plan.outputs.depot-project-id }}
          pull-build-id: ${{ needs.plan.outputs.save == 'true' && needs.build-base.outputs.build-id || '' }}
          file: ${{ steps.variant.outputs.file }}
          images: ${{ needs.plan.outputs.images }}
          aliases: ${{ steps.variant.outputs.aliases }}
          mode: ${{ needs.plan.outputs.mode }}
          version: ${{ needs.plan.outputs.version }}
          save: ${{ needs.plan.outputs.save }}

  manifest:
    name: collect image manifest
    needs: [plan, build-base, build-extra]
    if: needs.plan.outputs.save == 'true'
    runs-on: ${{ github.repository == 'astral-sh/ruff' && 'github-ubuntu-24.04-x86_64-4' || 'ubuntu-latest' }}
    timeout-minutes: 2
    outputs:
      artifact-id: ${{ steps.manifest.outputs.artifact-id }}
    steps:
      - uses: astral-sh/github-actions/docker-manifest@f9f03918930a74747a62150c3f009db66d171c5e
        id: manifest
        with:
          base-name: ruff
          image-mappings: ${{ toJson(fromJson(needs.plan.outputs.extra-images).image-mapping) }}

  publish-plan:
    needs: [plan, manifest]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ${{ github.repository == 'astral-sh/ruff' && 'github-ubuntu-24.04-x86_64-4' || 'ubuntu-latest' }}
    timeout-minutes: 2
    outputs:
      base-image: ${{ steps.plan.outputs.base-image }}
      extra-images: ${{ steps.plan.outputs.extra-images }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.manifest.outputs.artifact-id }}
          merge-multiple: true
      - name: Read image manifest
        id: plan
        run: |
          echo "base-image=$(jq -ce '.base' docker-manifest.json)" >> "$GITHUB_OUTPUT"
          echo "extra-images=$(jq -ce '{include: .extra}' docker-manifest.json)" >> "$GITHUB_OUTPUT"

  publish-extra:
    name: publish ${{ matrix.name }}
    needs: publish-plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.publish-plan.outputs.extra-images) }}
    uses: $/.github/workflows/publish-docker-image.yml
    with:
      image: ${{ toJson(matrix) }}
    permissions:
      contents: read
      id-token: write
      packages: write
      attestations: write

  # Publish the annotated base index last so GHCR lists it before its variants.
  publish-base:
    name: publish ruff
    needs: [publish-plan, publish-extra]
    uses: $/.github/workflows/publish-docker-image.yml
    with:
      image: ${{ needs.publish-plan.outputs.base-image }}
    permissions:
      contents: read
      id-token: write
      packages: write
      attestations: write
