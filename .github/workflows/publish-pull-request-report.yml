name: Publish a pull request report

on:
  workflow_call:
    inputs:
      report:
        type: string
        required: true
      artifact:
        type: string
        required: true
      filename:
        type: string
        required: true
      title:
        type: string
        default: ""
      update-existing-only:
        description: Update the report only if its comment already exists on the pull request.
        type: boolean
        default: false
      full-report-artifact:
        type: string
        default: ""
      upload-html:
        type: boolean
        default: false
      html-files:
        type: string
        default: "{}"
    secrets:
      KV_API_URL:
        required: true
      STS_API_URL:
        required: true
  # The automation app dispatches to main after a fork PR's report workflow completes.
  workflow_dispatch:
    inputs:
      run_id:
        description: Report workflow run ID
        required: true
        type: string
      run_attempt:
        description: Completed run attempt
        required: true
        type: string
      head_repository_id:
        description: Repository ID of the pull request head
        required: true
        type: string

permissions: {}

env:
  UV_LOCKED: 1

jobs:
  publish:
    if: >-
      github.repository == 'astral-sh/ruff' &&
      ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: github-ubuntu-24.04-x86_64-2
    timeout-minutes: 10
    environment:
      name: automations
      deployment: false
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: >-
        ${{ github.event_name == 'workflow_dispatch'
            && format('fork-ty-report-{0}', inputs.head_repository_id)
            || format('pull-request-report-{0}-{1}', github.event.pull_request.number, inputs.report) }}
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          sparse-checkout: scripts
          persist-credentials: false
      - uses: $/.github/actions/setup-ruff-workspace
      - name: Read the stored comment ID
        if: github.event_name == 'pull_request'
        id: comment-id
        uses: astral-sh/github-actions/key-value-store/get@9ece8e1afa7e9485a0bc35c40e34e1fa495ae454
        with:
          service-url: ${{ secrets.KV_API_URL }}
          scope: pull-request
          key: report-comment-${{ inputs.report }}
          path: ${{ runner.temp }}/report-comment-id-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Get a report publishing token
        if: ${{ !inputs.update-existing-only || steps.comment-id.outputs.found == 'true' }}
        id: token
        uses: astral-sh/github-actions/simple-token-service@eb81cf4d13127c3f9539f621c17e4c65327636c8
        with:
          exchange-url: ${{ secrets.STS_API_URL }}/exchange
          audience: ${{ secrets.STS_API_URL }}
          repository: astral-sh/ruff
          permissions: |
            actions: read
            pull_requests: write
      - name: Get report upload credentials
        if: github.event_name == 'pull_request' && inputs.upload-html && steps.token.outcome == 'success'
        id: aws
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: ${{ vars.REPORTS_REGION }}
          role-to-assume: ${{ vars.REPORTS_ROLE_ARN }}
          role-duration-seconds: 900
          role-session-name: report-${{ github.run_id }}-${{ github.run_attempt }}
          unset-current-credentials: true
      - name: Publish the report
        if: github.event_name == 'pull_request' && steps.token.outcome == 'success'
        id: publish
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          REPORT: ${{ inputs.report }}
          REPORT_ARTIFACT: ${{ inputs.artifact }}
          REPORT_FILENAME: ${{ inputs.filename }}
          REPORT_TITLE: ${{ inputs.title }}
          FULL_REPORT_ARTIFACT: ${{ inputs.full-report-artifact }}
          HTML_BUCKET: ${{ steps.aws.outcome == 'success' && vars.REPORTS_BUCKET || '' }}
          HTML_BASE_URL: ${{ vars.REPORTS_URL }}
          HTML_FILES: ${{ inputs.html-files }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          COMMENT_ID_FILE: ${{ runner.temp }}/report-comment-id-${{ github.run_id }}-${{ github.run_attempt }}
        run: >-
          uv run --script scripts/publish_pr_report.py
          --run-id "$RUN_ID" --run-attempt "$RUN_ATTEMPT"
          --workflow-ref "$WORKFLOW_REF"
          --report "$REPORT" --pull-request "$PULL_REQUEST"
          --artifact "$REPORT_ARTIFACT" --filename "$REPORT_FILENAME"
          --title "$REPORT_TITLE" --full-report-artifact "$FULL_REPORT_ARTIFACT"
          --html-bucket "$HTML_BUCKET" --html-base-url "$HTML_BASE_URL"
          --html-files "$HTML_FILES"
          --comment-id-file "$COMMENT_ID_FILE"
          ${{ inputs.update-existing-only && '--update-existing-only' || '' }}
      - name: Store the comment ID
        if: steps.publish.outputs.comment-id != ''
        uses: astral-sh/github-actions/key-value-store/put@9ece8e1afa7e9485a0bc35c40e34e1fa495ae454
        with:
          service-url: ${{ secrets.KV_API_URL }}
          scope: pull-request
          key: report-comment-${{ inputs.report }}
          value: ${{ steps.publish.outputs.comment-id }}
      - name: Link to the fork report artifacts
        if: github.event_name == 'workflow_dispatch' && steps.token.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          RUN_ID: ${{ inputs.run_id }}
          RUN_ATTEMPT: ${{ inputs.run_attempt }}
          HEAD_REPOSITORY_ID: ${{ inputs.head_repository_id }}
        run: >-
          uv run --script scripts/publish_pr_report.py
          --fork-repository-id "$HEAD_REPOSITORY_ID"
          --run-id "$RUN_ID" --run-attempt "$RUN_ATTEMPT"
