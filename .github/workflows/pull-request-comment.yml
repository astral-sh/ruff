name: Reserve automation report index

on:
  workflow_call:
    secrets:
      STS_API_URL:
        required: true

permissions: {}

env:
  UV_LOCKED: 1

jobs:
  reserve:
    if: >-
      github.repository == 'astral-sh/ruff' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: github-ubuntu-24.04-x86_64-2
    timeout-minutes: 5
    environment: automations
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: pull-request-automation-comment-${{ github.event.pull_request.number }}
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          sparse-checkout: scripts
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # renovate: datasource=github-release-attachments depName=astral-sh/uv
          version: "0.13.4"
          checksum: "2b428396f12572d4429cf210ca234dd599a33b3af0958a4d5ed569d63e3f344f"
          enable-cache: false
      - name: Get a report comment token
        id: token
        uses: open-security-tools/ost-simple-sts@9e012247e07c39080fb6a832dbfbcfeacebc19c4
        with:
          exchange-url: ${{ secrets.STS_API_URL }}/exchange
          audience: ${{ secrets.STS_API_URL }}
          repository: astral-sh/ruff
          permissions: |
            pull_requests: write
      - name: Reserve an early report index
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: uv run --script scripts/pull_request_comments.py reserve --pull-request "$PULL_REQUEST"
