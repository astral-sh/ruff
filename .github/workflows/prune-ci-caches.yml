name: Prune CI caches

on:
  schedule:
    - cron: "17 */6 * * *"
  # Manual runs preview the next scheduled cleanup.
  workflow_dispatch:

permissions: {}

jobs:
  prune:
    if: github.repository == 'astral-sh/ruff' && github.ref == 'refs/heads/main'
    runs-on: github-ubuntu-24.04-x86_64-2
    timeout-minutes: 15
    permissions:
      actions: write
      pull-requests: read
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const caches = await github.paginate(github.rest.actions.getActionsCacheList, {
              ...context.repo,
              per_page: 100,
              sort: "created_at",
              direction: "desc",
            });
            const preview = context.eventName === "workflow_dispatch";
            let eligibleBytes = 0;
            const cutoff = Date.now() - 24 * 60 * 60 * 1000;
            // A write during pagination can put the same cache on two pages.
            const uniqueCaches = new Map(caches.map(cache => [cache.id, cache]));

            for (const [ref, entries] of Map.groupBy(uniqueCaches.values(), cache => cache.ref)) {
              let candidates = entries;
              if (ref === "refs/heads/main") {
                const generations = new Map();
                candidates = entries.filter(cache => {
                  // rust-cache appends a lockfile hash to the job, OS, architecture, and Rust environment.
                  const match = /^(v0-rust-.+-(?:Linux|Darwin|Windows_NT)-[^-]+-[a-f0-9]{8})-[a-f0-9]{8}$/.exec(cache.key);
                  if (!match || !cache.size_in_bytes) return false;
                  const group = `${cache.version}:${match[1]}`;
                  const count = generations.get(group) ?? 0;
                  generations.set(group, count + 1);
                  return count >= 2 && Date.parse(cache.last_accessed_at) < cutoff;
                });
              } else {
                const pull = /^refs\/pull\/(\d+)\/merge$/.exec(ref);
                if (!pull) continue;
                const { data: pr } = await github.rest.pulls.get({
                  ...context.repo,
                  pull_number: Number(pull[1]),
                });
                if (pr.state !== "closed") continue;
              }

              for (const cache of candidates) {
                eligibleBytes += cache.size_in_bytes;
                core.info(`${preview ? "Would delete" : "Deleting"} cache ${cache.id} from ${ref}`);
                if (preview) continue;

                // Pace mutations to stay within GitHub's secondary rate limit.
                await new Promise(resolve => setTimeout(resolve, 1000));
                try {
                  await github.rest.actions.deleteActionsCacheById({ ...context.repo, cache_id: cache.id });
                } catch (error) {
                  if (error.status !== 404) throw error;
                }
              }
            }
            core.info(`Selected ${(eligibleBytes / 1e9).toFixed(2)} GB for cleanup`);
