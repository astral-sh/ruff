name: Dispatch pull request reviewer selection

on:
  workflow_call:
    secrets:
      STS_API_URL:
        required: true

permissions: {}

jobs:
  dispatch:
    if: >-
      github.repository == 'astral-sh/ruff' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft && vars.KEY_VALUE_SERVICE_URL != ''
    runs-on: github-ubuntu-24.04-x86_64-2
    timeout-minutes: 5
    environment: automations
    permissions:
      id-token: write
    steps:
      - name: Get a dispatch token
        id: token
        uses: open-security-tools/ost-simple-sts@9e012247e07c39080fb6a832dbfbcfeacebc19c4
        with:
          exchange-url: ${{ secrets.STS_API_URL }}/exchange
          audience: ${{ secrets.STS_API_URL }}
          repository: astral-sh/ruff
          permissions: |
            actions: write
      - name: Queue reviewer selection on main
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: |
          [[ "$PULL_REQUEST" =~ ^[1-9][0-9]*$ ]]
          gh api --method POST \
            repos/astral-sh/ruff/actions/workflows/pull-request-reviewers.yml/dispatches \
            --raw-field ref=main \
            --raw-field "inputs[pull-request]=$PULL_REQUEST"
