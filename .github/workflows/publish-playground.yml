# Publish the Ruff playground.
#
# Assumed to run as a subworkflow of .github/workflows/release.yml; specifically, as a post-announce
# job within `cargo-dist`.
name: "[Playground] Release"

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string
      artifact-id:
        required: true
        type: string

env:
  UV_LOCKED: 1
  ACTIONS_CACHE_MODE: none

permissions:
  contents: read

jobs:
  build:
    if: ${{ inputs.artifact-id == '' }}
    uses: $/.github/workflows/build-playground.yml
    permissions:
      contents: read

  publish:
    needs: build
    if: ${{ !cancelled() && (needs.build.result == 'success' || (needs.build.result == 'skipped' && inputs.artifact-id != '')) }}
    runs-on: ${{ github.repository == 'astral-sh/ruff' && 'github-ubuntu-24.04-x86_64-4' || 'ubuntu-latest' }}
    environment: release-playground
    env:
      CF_API_TOKEN_EXISTS: ${{ secrets.CF_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: "Download Ruff playground"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ inputs.artifact-id || needs.build.outputs.artifact-id }}
          path: playground/ruff/dist
          digest-mismatch: error
      - name: "Verify static playground assets"
        run: |
          # The build runs without deployment credentials, but its output may
          # still be compromised. Check for missing required assets, and reject
          # links and special files before the publisher consumes the artifact.
          # Wrangler can deploy `_worker.js` in the output or `functions/` in its
          # working directory as server-side Pages code, so reject both.
          # These checks do not establish that the generated HTML or JavaScript is safe.
          test -f playground/ruff/dist/index.html
          test ! -e playground/ruff/dist/_worker.js
          test ! -e functions
          if [[ -n "$(find playground/ruff/dist ! -type f ! -type d -print -quit)" ]]; then
            echo "Playground artifacts must contain only regular files and directories"
            exit 1
          fi
      - name: "Install deployment dependencies"
        if: ${{ env.CF_API_TOKEN_EXISTS == 'true' }}
        run: npm ci --ignore-scripts
        working-directory: playground/deploy
      - name: "Deploy to Cloudflare Pages"
        if: ${{ env.CF_API_TOKEN_EXISTS == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          # `github.head_ref` is only set during pull requests and for manual runs or tags we use `main` to deploy to production
          DEPLOY_BRANCH: ${{ github.head_ref || 'main' }}
        run: ./playground/deploy/node_modules/.bin/wrangler pages deploy playground/ruff/dist --project-name=ruff-playground --branch "$DEPLOY_BRANCH" --commit-hash "$GITHUB_SHA"
