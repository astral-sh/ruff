name: Verify instrumented ty benchmark artifacts

on:
  push:
    branches: [micha/ty-benchmark-artifacts-ci]

permissions:
  contents: read

env:
  UV_LOCKED: 1
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10

jobs:
  benchmarks-instrumented-ty-build:
    name: "benchmarks instrumented ty (build)"
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 20
    steps:
      - name: "Checkout Branch"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: $/.github/actions/setup-ruff-workspace
        with:
          enable-cache: auto

      - name: "Install Rust toolchain"
        run: rustup show

      - name: "Build benchmarks"
        run: uv run --only-dev cargo codspeed build -m simulation -m memory --features "codspeed,module_resolution,ty_instrumented" --profile profiling --no-default-features -p ruff_benchmark --bench module_resolution --bench ty --bench ty_constraint_set --bench ty_projects

      - name: Upload module_resolution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmarks-instrumented-module_resolution
          path: target/codspeed/**/module_resolution
          compression-level: 1
          if-no-files-found: "error"
          retention-days: 1

      - name: Upload ty
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmarks-instrumented-ty
          path: target/codspeed/**/ty
          compression-level: 1
          if-no-files-found: "error"
          retention-days: 1

      - name: Upload ty_constraint_set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmarks-instrumented-ty_constraint_set
          path: target/codspeed/**/ty_constraint_set
          compression-level: 1
          if-no-files-found: "error"
          retention-days: 1

      - name: Upload ty_projects
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmarks-instrumented-ty_projects
          path: target/codspeed/**/ty_projects
          compression-level: 1
          if-no-files-found: "error"
          retention-days: 1

  benchmarks-instrumented-ty-run:
    name: "benchmarks instrumented ty (${{ matrix.mode }}: ${{ matrix.name }})"
    runs-on: depot-ubuntu-24.04
    needs: benchmarks-instrumented-ty-build
    timeout-minutes: 20
    permissions:
      contents: read # required for actions/checkout
      id-token: write # required for OIDC authentication with CodSpeed
    strategy:
      fail-fast: false
      matrix:
        include:
          # The r benchmarks dominate runtime, so group them with a-c to balance both modes.
          - name: micro-1
            target: ty
            filter: 'ty_micro\[[a-cr]'
            mode: simulation
          - name: micro-2
            target: ty
            filter: 'ty_micro\[[^a-cr]'
            mode: simulation
          - name: micro-1
            target: ty
            filter: 'ty_micro\[[a-cr]'
            mode: memory
          - name: micro-2
            target: ty
            filter: 'ty_micro\[[^a-cr]'
            mode: memory
          - name: constraint_set
            target: ty_constraint_set
            filter: micro
            mode: simulation
          - name: constraint_set
            target: ty_constraint_set
            filter: micro
            mode: memory
          - name: projects
            target: ty_projects
            filter: ".*"
            mode: simulation
          - name: projects
            target: ty_projects
            filter: ".*"
            mode: memory
          - name: module_resolution
            target: module_resolution
            filter: ty_module_resolver
            mode: simulation
    steps:
      - name: "Checkout Branch"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-ruff-workspace
        with:
          enable-cache: auto

      - name: "Download benchmark binary"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: benchmarks-instrumented-${{ matrix.target }}
          path: target/codspeed

      - name: Verify downloaded target
        env:
          BENCH_TARGET: ${{ matrix.target }}
        run: |
          find target/codspeed -type f
          test "$(find target/codspeed -type f)" = "target/codspeed/analysis/ruff_benchmark/$BENCH_TARGET"

      - name: "Restore binary permissions"
        # codspeed keeps changing the paths to the executable, so we have to be a bit more flexible
        run: find target/codspeed -type f -exec chmod +x {} +

      - name: "Configure apt mirror fallback"
        if: matrix.mode == 'simulation'
        run: |
          # Let CodSpeed's dependency installation move past unhealthy mirrors quickly.
          cat /etc/apt/apt-mirrors.txt
          printf '%s\n' \
            'Acquire::Retries "0";' \
            'Acquire::http::Timeout "10";' \
            'Acquire::https::Timeout "10";' \
            | sudo tee /etc/apt/apt.conf.d/80-retries > /dev/null

      - name: "Run benchmarks"
        uses: CodSpeedHQ/action@c4fd08a3a159bd0cc208da1e0edf32b8c47d75e5 # v5.4.0
        with:
          mode: ${{ matrix.mode }}
          disable-memory-capture-stack: true
          run: uv run --only-dev cargo codspeed run --bench "${{ matrix.target }}" "${{ matrix.filter }}"
      - name: Check the project cache
        if: matrix.target == 'ty' || matrix.target == 'ty_projects'
        env:
          BENCH_TARGET: ${{ matrix.target }}
        run: |
          for project in anyio attrs hydra-zen DateType; do
            checkout="$(find . -type d -path "*/benchmark_cache/$project" -print -quit)"
            if [[ "$BENCH_TARGET" == ty ]]; then
              test -z "$checkout"
            else
              test -n "$checkout"
              echo "$checkout"
            fi
          done
