# Bump the Ruff version and create a pull request.
name: "Prepare release"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "The version to set (overrides detection)"
        required: false
        type: string

permissions: {}

env:
  UV_LOCKED: 1

jobs:
  prepare-release:
    if: github.repository == 'astral-sh/ruff' && github.ref == 'refs/heads/main'
    runs-on: ${{ github.repository == 'astral-sh/ruff' && 'github-ubuntu-24.04-x86_64-4' || 'ubuntu-latest' }}
    environment:
      name: automations
      deployment: false
    permissions:
      contents: read
      id-token: write # for the credential broker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: $/.github/actions/setup-ruff-workspace
        with:
          enable-cache: true

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: false

      - name: "Get Ruff token"
        id: token
        uses: astral-sh/github-actions/simple-token-service@67dc9ee1ddc113eccd8116e7b949fb6cdcd89889 # 2026.11.16.0
        with:
          exchange-url: ${{ secrets.STS_API_URL }}/exchange
          audience: ${{ secrets.STS_API_URL }}
          repository: astral-sh/ruff
          permissions: |
            contents: write
            pull_requests: write

      - name: "Configure Git"
        run: |
          git config user.name "astral-automations-bot[bot]"
          git config user.email "305554984+astral-automations-bot[bot]@users.noreply.github.com"

      - name: "Bump version"
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            ./scripts/release.sh --version "$INPUT_VERSION"
          else
            ./scripts/release.sh
          fi
        env:
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}
          INPUT_VERSION: ${{ inputs.version }}

      - name: "Install Rust toolchain"
        run: rustup component add rustfmt

      - name: "Format and check release changes"
        shell: bash
        run: |
          mapfile -d '' files < <(git diff --name-only --diff-filter=ACMR -z HEAD)
          if (( ${#files[@]} )); then
            # Hooks can fix generated files and exit nonzero. Require a clean pass before committing.
            uv run --only-dev --locked prek run --files "${files[@]}" ||
              uv run --only-dev --locked prek run --files "${files[@]}"
          fi

      - name: "Create release branch"
        run: |
          version="$(uv version --short)"
          git switch -c "release/$version"
          git commit -am "Bump version to $version"

      - name: "Prepare Codex prompt"
        run: |
          {
            printf 'Release preparation for Ruff %s: Rewrite changelog\n\n' "$(uv version --short)"
            cat .agents/prompts/editorialize-changelog.md
          } > "$RUNNER_TEMP/editorialize-changelog-prompt.md"

      - name: "Rewrite changelog"
        uses: openai/codex-action@c05cfd74ad95c626cdf05c6685e62becc3bf7813
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          codex-version: "0.169.0"
          model: gpt-5.6-sol
          effort: high
          permission-profile: ":read-only"
          safety-strategy: drop-sudo
          prompt-file: "${{ runner.temp }}/editorialize-changelog-prompt.md"
          output-file: "${{ runner.temp }}/changelog-section.md"

      - name: "Upload Codex thread"
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codex-thread-release-prepare-${{ github.run_id }}-${{ github.run_attempt }}
          path: ~/.codex/sessions
          if-no-files-found: warn

      - name: "Apply changelog rewrite"
        run: |
          uv run --locked scripts/update-latest-changelog-section.py \
            CHANGELOG.md \
            "$RUNNER_TEMP/changelog-section.md"

      - name: "Commit changelog rewrite"
        run: |
          git diff --check -- CHANGELOG.md
          if git diff --quiet -- CHANGELOG.md; then
            echo "Codex left the generated changelog unchanged."
          else
            git -c core.hooksPath=/dev/null commit --only --message "Rewrite changelog" -- CHANGELOG.md
          fi

      - name: "Create or update pull request"
        run: |
          branch="$(git branch --show-current)"
          git push --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:"$branch"

          pull_request="$(
            gh pr list \
              --base main \
              --head "$branch" \
              --state open \
              --json url \
              --jq '.[0].url'
          )"
          if [ -n "$pull_request" ]; then
            printf '%s\n' "$pull_request"
          else
            gh pr create \
              --base main \
              --head "$branch" \
              --fill-first
          fi
        env:
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}
