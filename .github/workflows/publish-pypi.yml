# Publish a release to PyPI.
#
# Assumed to run as a subworkflow of .github/workflows/release.yml; specifically, as a publish job
# within `cargo-dist`.
name: "[ruff] Publish to PyPI"

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string
      artifacts:
        description: "Artifact ID for the complete verified PyPI distributions"
        required: true
        type: string

env:
  UV_LOCKED: 1
  ACTIONS_CACHE_MODE: none

jobs:
  pypi-publish:
    name: Upload to PyPI
    runs-on: ${{ github.repository == 'astral-sh/ruff' && 'github-ubuntu-24.04-x86_64-4' || 'ubuntu-latest' }}
    environment:
      name: release
    permissions:
      # For PyPI's trusted publishing.
      id-token: write
    steps:
      - uses: $/.github/actions/setup-ruff-workspace
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ inputs.artifacts }}
          path: wheels
          merge-multiple: true
      - name: Publish to PyPi
        run: uv publish -v wheels/*
