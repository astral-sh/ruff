name: Compare ty benchmark profiling

on:
  push:
    branches: [micha/ty-profile-timing-experiment]

permissions:
  contents: read

env:
  UV_LOCKED: 1

jobs:
  benchmarks-instrumented-ty-run:
    name: "benchmarks instrumented ty (${{ matrix.mode }}: ${{ matrix.name }})"
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read # download the main run’s compiled benchmark artifact
      contents: read # required for actions/checkout
      id-token: write # required for OIDC authentication with CodSpeed
    strategy:
      fail-fast: false
      matrix:
        include:
          # The r benchmarks dominate runtime, so group them with a-c to balance both modes.
          - name: micro-1
            target: ty
            filter: 'ty_micro\[[a-cr]'
            mode: simulation
          - name: micro-2
            target: ty
            filter: 'ty_micro\[[^a-cr]'
            mode: simulation
          - name: micro-1
            target: ty
            filter: 'ty_micro\[[a-cr]'
            mode: memory
          - name: micro-2
            target: ty
            filter: 'ty_micro\[[^a-cr]'
            mode: memory
          - name: constraint_set
            target: ty_constraint_set
            filter: micro
            mode: simulation
          - name: constraint_set
            target: ty_constraint_set
            filter: micro
            mode: memory
          - name: projects
            target: ty
            filter: "check_file|anyio|attrs|hydra|datetype"
            mode: simulation
          - name: projects
            target: ty
            filter: "check_file|anyio|attrs|hydra|datetype"
            mode: memory
          - name: module_resolution
            target: module_resolution
            filter: ty_module_resolver
            mode: simulation
    steps:
      - name: "Checkout Branch"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-ruff-workspace
        with:
          enable-cache: auto

      - name: "Download benchmark binary"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: 42083574052
          name: benchmarks-instrumented-ty-binary
          path: target/codspeed

      - name: "Restore binary permissions"
        # codspeed keeps changing the paths to the executable, so we have to be a bit more flexible
        run: find target/codspeed -type f -exec chmod +x {} +

      - name: "Configure apt mirror fallback"
        if: matrix.mode == 'simulation'
        run: |
          # Let CodSpeed's dependency installation move past unhealthy mirrors quickly.
          cat /etc/apt/apt-mirrors.txt
          printf '%s\n' \
            'Acquire::Retries "0";' \
            'Acquire::http::Timeout "10";' \
            'Acquire::https::Timeout "10";' \
            | sudo tee /etc/apt/apt.conf.d/80-retries > /dev/null

      - name: "Run benchmarks"
        uses: CodSpeedHQ/action@c4fd08a3a159bd0cc208da1e0edf32b8c47d75e5 # v5.4.0
        env:
          CODSPEED_PROFILER_ENABLED: false
        with:
          mode: ${{ matrix.mode }}
          disable-memory-capture-stack: true
          run: uv run --only-dev cargo codspeed run --bench "${{ matrix.target }}" "${{ matrix.filter }}"
