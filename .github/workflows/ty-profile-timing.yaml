name: Compare ty benchmark profiling

on:
  push:
    branches: [micha/ty-profile-timing-experiment]

permissions:
  contents: read

env:
  UV_LOCKED: 1

jobs:
  projects:
    name: "projects (${{ matrix.order }})"
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 35
    permissions:
      actions: read
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        order: [on-then-off, off-then-on]
    steps:
      - name: "Checkout Branch"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-ruff-workspace
        with:
          enable-cache: auto

      - name: "Download benchmark binary"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: 42083574052
          name: benchmarks-instrumented-ty-binary
          path: target/codspeed

      - name: "Restore binary permissions"
        # codspeed keeps changing the paths to the executable, so we have to be a bit more flexible
        run: find target/codspeed -type f -exec chmod +x {} +

      - name: First projects run
        uses: CodSpeedHQ/action@c4fd08a3a159bd0cc208da1e0edf32b8c47d75e5 # v5.4.0
        env:
          CODSPEED_SKIP_UPLOAD: true
        with:
          mode: memory
          disable-memory-capture-stack: ${{ matrix.order == 'off-then-on' }}
          run: uv run --only-dev cargo codspeed run --bench ty "check_file|anyio|attrs|hydra|datetype"

      - name: Second projects run
        uses: CodSpeedHQ/action@c4fd08a3a159bd0cc208da1e0edf32b8c47d75e5 # v5.4.0
        env:
          CODSPEED_SKIP_UPLOAD: true
        with:
          mode: memory
          disable-memory-capture-stack: ${{ matrix.order == 'on-then-off' }}
          run: uv run --only-dev cargo codspeed run --bench ty "check_file|anyio|attrs|hydra|datetype"
