# Configuration for the actionlint tool, which we run via prek
# to verify the correctness of the syntax in our GitHub Actions workflows.

self-hosted-runner:
  # Various runners we use that aren't recognized out-of-the-box by actionlint:
  labels:
    - nscloud-ubuntu-24.04-amd64-2x8-with-features
    - namespace-features:container.privileged=true
    - nscloud-ubuntu-24.04-amd64-4x16
    - nscloud-ubuntu-24.04-amd64-8x32
    - nscloud-ubuntu-22.04-amd64-8x32
    - nscloud-ubuntu-22.04-amd64-16x64
    - nscloud-ubuntu-22.04-amd64-32x128
    - namespace-profile-macos-15
    - namespace-profile-windows-2022-x86-64-16x32
    - nscloud-ubuntu-22.04-arm64-4x16
    - nscloud-ubuntu-24.04-arm64-8x32
    - github-ubuntu-24.04-x86_64-2
    - github-ubuntu-24.04-x86_64-4
    - github-ubuntu-24.04-x86_64-32
    - github-windows-2025-x86_64-8
    - github-windows-2025-x86_64-16
    - codspeed-macro

paths:
  ".github/workflows/*.{yml,yaml}":
    ignore:
      # `actionlint` does not yet recognize GitHub's `$/` syntax.
      # https://github.com/rhysd/actionlint/issues/711
      - '^reusable workflow call "\$/\.github/workflows/[^"/]+\.ya?ml" at "uses" is not following the format '
      - '^specifying action "\$/python/py-fuzzer" in invalid format because ref is missing\.'
  ".github/workflows/pull-request-reviewers.yml":
    ignore:
      # actionlint doesn't yet support concurrency queues. The schema hook validates them.
      - '^unexpected key "queue" for "concurrency" section\.'
  ".github/workflows/publish-pull-request-report.yml":
    ignore:
      # actionlint doesn't yet support concurrency queues. The schema hook validates them.
      - '^unexpected key "queue" for "concurrency" section\.'
      # actionlint doesn't yet recognize the reusable workflow's own revision context.
      - 'property "workflow_(repository|sha)" is not defined in object type'
  ".github/workflows/{ty-ecosystem-analyzer,memory_report,sync_typeshed}.yaml":
    ignore:
      # actionlint doesn't yet support the cache-mode feature.
      # The schema hook validates it.
      - '^unexpected key "cache-mode" for "workflow" section\.'
