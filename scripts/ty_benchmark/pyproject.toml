[project]
name = "ty_benchmark"
version = "0.0.1"
description = "Package for running end-to-end ty benchmarks"
requires-python = ">=3.14"
dependencies = [
    # mypy is missing here because we need to install it into the project's virtual environment
    # for plugins to work. See `Venv.install`.
    # Pyright is missing because we install it with `npm` to avoid measuring the overhead
    # of the Python wrapper script (that lazily installs Pyright).
    "mslex>=1.3.0",
    "pyrefly==1.4.0",
    "pytest-benchmark>=4.0.0",
    "pytest>=8.0.0",
    "pygls>=2.0.0",
    "lsprotocol>=2025.0.0",
]

[project.scripts]
benchmark = "benchmark.run:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[tool.ruff.lint]
ignore = [
    "E501", # We use ruff format
]

[tool.ty.analysis]
return-type-inference = "always"

[tool.ty.rules]
blanket-ignore-comment = "error"
missing-type-argument = "error"
unsound-return-statement = "error"
unsound-yield = "error"
unsupported-dynamic-base = "error"
dynamic-function-decorator-return = "error"
unsound-assignment = "error"
redundant-condition-strict = "error"
disjoint-cast = "error"
missing-direct-dependency = "error"
truthiness-test-of-none-union = "error"
possibly-unresolved-reference = "error"
division-by-zero = "error"
unused-ignore-comment = "error"

[tool.uv]
no-build = true
require-build-hashes = true
no-binary-package = ["ty-benchmark"]
# Pin the isolated build environment for source-build exceptions.
build-constraint-dependencies = [
    { requirement = "uv-build==0.13.5", hashes = [
