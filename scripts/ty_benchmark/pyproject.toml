[project]
name = "ty_benchmark"
version = "0.0.1"
description = "Package for running end-to-end ty benchmarks"
requires-python = ">=3.14"
dependencies = [
    # mypy is missing here because we need to install it into the project's virtual environment
    # for plugins to work. See `Venv.install`.
    # Pyright is missing because we install it with `npm` to avoid measuring the overhead
    # of the Python wrapper script (that lazily installs Pyright).
    "mslex>=1.3.0",
    "pyrefly==1.2.0",
    "pytest-benchmark>=4.0.0",
    "pytest>=8.0.0",
    "pygls>=2.0.0",
    "lsprotocol>=2025.0.0",
]

[project.scripts]
benchmark = "benchmark.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/benchmark"]

[tool.ruff.lint]
ignore = [
    "E501", # We use ruff format
]

[tool.ty.rules]
possibly-unresolved-reference = "error"
division-by-zero = "error"
unused-ignore-comment = "error"

[tool.uv]
no-build = true
no-binary-package = ["ty-benchmark"]
# Pin the isolated build environment for source-build exceptions.
build-constraint-dependencies = [
    "editables==0.6",
    "hatchling==1.32.0",
    "packaging==26.3",
    "pathspec==1.1.1",
    "pluggy==1.6.0",
    "tomlkit==0.15.1",
    "trove-classifiers==2026.6.1.19",
]
exclude-newer = "P7D"
